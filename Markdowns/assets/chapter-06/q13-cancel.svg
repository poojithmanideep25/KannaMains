<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Sign reversal removes odd choice indices</title><desc id="desc">Illustrationn6keepsindices0,2,4,6from(x+a)^6+(x-a)^6.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Sign reversal removes odd choice indices</text>
<rect x="80" y="150" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="120.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=0</text>
<text x="120.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">keep ×2</text>
<rect x="205" y="150" width="80" height="65" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="245.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=1</text>
<text x="245.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#a04c13" text-anchor="middle" font-weight="400">cancel</text>
<rect x="330" y="150" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="370.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=2</text>
<text x="370.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">keep ×2</text>
<rect x="455" y="150" width="80" height="65" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="495.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=3</text>
<text x="495.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#a04c13" text-anchor="middle" font-weight="400">cancel</text>
<rect x="580" y="150" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="620.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=4</text>
<text x="620.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">keep ×2</text>
<rect x="705" y="150" width="80" height="65" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="745.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=5</text>
<text x="745.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#a04c13" text-anchor="middle" font-weight="400">cancel</text>
<rect x="830" y="150" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="870.00" y="190.50" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">r=6</text>
<text x="870.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">keep ×2</text>
<text x="500.00" y="100.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Same coefficients; odd powers of a reverse sign.</text>
<text x="500.00" y="412.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">For degree 100 the kept indices are 0,2,…,100: 51 formal terms.</text>
</svg>