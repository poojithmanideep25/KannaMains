<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Keep a small remainder, not the whole power</title><desc id="desc">Powers7^1,7²,7³,7⁴haveordinaryremainders7,24,18,1mod25.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Keep a small remainder, not the whole power</text>
<rect x="115" y="160" width="110" height="75" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="170.00" y="205.50" font-family="Arial,sans-serif" font-size="28" fill="#155e82" text-anchor="middle" font-weight="400">7</text>
<text x="170.00" y="120.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">7^1</text>
<line x1="235.00" y1="197.00" x2="305.00" y2="197.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="325" y="160" width="110" height="75" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="380.00" y="205.50" font-family="Arial,sans-serif" font-size="28" fill="#155e82" text-anchor="middle" font-weight="400">24</text>
<text x="380.00" y="120.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">7^2</text>
<line x1="445.00" y1="197.00" x2="515.00" y2="197.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="535" y="160" width="110" height="75" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="590.00" y="205.50" font-family="Arial,sans-serif" font-size="28" fill="#155e82" text-anchor="middle" font-weight="400">18</text>
<text x="590.00" y="120.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">7^3</text>
<line x1="655.00" y1="197.00" x2="725.00" y2="197.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="745" y="160" width="110" height="75" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="800.00" y="205.50" font-family="Arial,sans-serif" font-size="28" fill="#155e82" text-anchor="middle" font-weight="400">1</text>
<text x="800.00" y="120.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">7^4</text>
<text x="500.00" y="315.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Next power returns to remainder 7. Cycle length: 4.</text>
<text x="500.00" y="402.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Modulo 25. The ordinary remainder is always from 0 through 24.</text>
</svg>