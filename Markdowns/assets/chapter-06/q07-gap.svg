<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">The conjugate fills the gap to the next integer</title><desc id="desc">SchematicunitintervalfromItoI+1splitatI+f;conjugatepowerg=1-f.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">The conjugate fills the gap to the next integer</text>
<line x1="125.00" y1="210.00" x2="900.00" y2="210.00" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="160.00" cy="210.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="160.00" y="255.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">I</text>
<circle cx="600.00" cy="210.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="600.00" y="255.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">I + f</text>
<circle cx="850.00" cy="210.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="850.00" y="255.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">I + 1</text>
<line x1="160.00" y1="140.00" x2="600.00" y2="140.00" stroke="#155e82" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380.00" y="115.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="400">fractional part f</text>
<line x1="600.00" y1="140.00" x2="850.00" y2="140.00" stroke="#a04c13" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="725.00" y="115.00" font-family="Arial,sans-serif" font-size="23" fill="#a04c13" text-anchor="middle" font-weight="400">gap 1−f = g</text>
<text x="500.00" y="402.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Schematic split, not the numerical size of Q7’s tiny gap. Both pieces are between 0 and 1.</text>
</svg>