<text x="500.00" y="435.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">Shown: r=2. Add cases r=0,1,…,6 to count every six-person group.</text>
<text x="500.00" y="522.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Population labels distinguish the groups; the selected committee itself has no internal order.</text>
