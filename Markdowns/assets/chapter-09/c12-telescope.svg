<text x="500.00" y="445.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="400">After n terms:  (1/2)[1 − 1/(2n+1)]</text>
<text x="500.00" y="502.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">A common factor 1/2 multiplies every row. Cancel equal interior reciprocals before taking the limit.</text>
