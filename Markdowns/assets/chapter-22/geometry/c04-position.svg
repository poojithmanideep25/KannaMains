<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Position arrows and the movement between their tips</title><desc id="desc">A true view in the plane of the two vectors. Dashed sides are translated copies; angles and relative lengths come from the supplied vectors.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Position arrows and the movement between their tips</text>
<line x1="190.00" y1="410.00" x2="655.00" y2="410.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="190.00" y1="410.00" x2="345.00" y2="100.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="190.00" cy="410.00" r="4.5" fill="#20394d"/>
<text x="166.00" y="434.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<circle cx="655.00" cy="410.00" r="4.5" fill="#20394d"/>
<text x="665.00" y="434.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<circle cx="345.00" cy="100.00" r="4.5" fill="#20394d"/>
<text x="325.00" y="86.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<line x1="655.00" y1="410.00" x2="345.00" y2="100.00" stroke="#a04c13" stroke-width="3" stroke-linecap="round" marker-end="url(#orange)"/>
<text x="518.00" y="263.00" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="start" font-weight="400">AB = OB − OA</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">OA + AB = OB. The orange movement starts at A.</text>
</svg>