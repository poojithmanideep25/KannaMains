<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q33: equal dots can come from different arrows</title><desc id="desc">The arrows b=(2,1) and c=(2,-1) have the same projection on a horizontal positive direction, but different perpendicular parts.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q33: equal dots can come from different arrows</text>
<line x1="210.00" y1="250.00" x2="820.00" y2="250.00" stroke="#718594" stroke-width="1.6" stroke-linecap="round"/>
<line x1="260.00" y1="250.00" x2="650.00" y2="85.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="260.00" y1="250.00" x2="650.00" y2="415.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="260.00" y1="250.00" x2="650.00" y2="250.00" stroke="#a04c13" stroke-width="4" stroke-linecap="round" marker-end="url(#orange)"/>
<line x1="650.00" y1="85.00" x2="650.00" y2="415.00" stroke="#718594" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="260.00" cy="250.00" r="4.5" fill="#20394d"/>
<text x="236.00" y="274.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<circle cx="650.00" cy="250.00" r="4.5" fill="#20394d"/>
<text x="662.00" y="240.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">H</text>
<circle cx="650.00" cy="85.00" r="4.5" fill="#20394d"/>
<text x="662.00" y="75.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">b</text>
<circle cx="650.00" cy="415.00" r="4.5" fill="#20394d"/>
<text x="662.00" y="439.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">c</text>
<path d="M630 250L630 230L650 230" fill="none" stroke="#20394d" stroke-width="2"/>
<text x="825.00" y="257.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">direction a</text>
<text x="460.00" y="282.00" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="middle" font-weight="400">same along-part OH</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal along-parts do not make the complete arrows equal.</text>
</svg>