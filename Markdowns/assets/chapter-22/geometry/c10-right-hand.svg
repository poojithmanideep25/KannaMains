<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Right-hand rule: turn from a to b</title><desc id="desc">a points right and b points up. Turning right-hand fingers from a towards b makes the thumb point out of the page.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Right-hand rule: turn from a to b</text>
<line x1="330.00" y1="310.00" x2="630.00" y2="310.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="330.00" y1="310.00" x2="330.00" y2="90.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="330.00" cy="310.00" r="4.5" fill="#20394d"/>
<text x="306.00" y="334.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<text x="645.00" y="317.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="start" font-weight="700">a</text>
<text x="344.00" y="88.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="start" font-weight="700">b</text>
<path d="M402.00,310.00 A72,72 0 0 0 330.00,238.00" fill="none" stroke="#718594" stroke-width="1.8"/>
<line x1="366.00" y1="247.00" x2="348.00" y2="239.00" stroke="#a04c13" stroke-width="2.5" stroke-linecap="round" marker-end="url(#orange)"/>
<circle cx="780" cy="185" r="20" fill="white" stroke="#20394d" stroke-width="2.4"/><circle cx="780" cy="185" r="5" fill="#20394d"/>
<text x="780.00" y="236.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">a × b</text>
<text x="780.00" y="269.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">out of the page</text>
<text x="500.00" y="422.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Curl the right-hand fingers from a to b; the thumb points towards your eye.</text>
</svg>