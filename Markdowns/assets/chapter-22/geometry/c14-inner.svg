<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">First: b × c gives the inner vector d</title><desc id="desc">Orthographic view of the actual two-vector plane. The normal arrow indicates direction; its drawn length is chosen for clarity.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">First: b × c gives the inner vector d</text>
<polygon points="500.00,410.00 613.47,311.73 500.00,213.47 386.53,311.73" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.6"/>
<line x1="500.00" y1="410.00" x2="613.47" y2="311.73" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="613.47" cy="311.73" r="4.5" fill="#20394d"/>
<text x="625.47" y="333.73" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">b</text>
<line x1="500.00" y1="410.00" x2="386.53" y2="311.73" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="386.53" cy="311.73" r="4.5" fill="#20394d"/>
<text x="364.53" y="311.73" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">c</text>
<line x1="613.47" y1="311.73" x2="500.00" y2="213.47" stroke="#718594" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="386.53" y1="311.73" x2="500.00" y2="213.47" stroke="#718594" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="500.00" y1="410.00" x2="500.00" y2="100.00" stroke="#20394d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#ink)"/>
<circle cx="500.00" cy="410.00" r="4.5" fill="#20394d"/>
<text x="476.00" y="430.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<text x="512.00" y="92.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">d = b × c</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The normal is perpendicular to both input arrows. Its drawn length only shows direction.</text>
</svg>