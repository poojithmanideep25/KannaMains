<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Scaling changes length; a minus sign also reverses direction</title><desc id="desc">Arrows share a scale of 100 pixels per unit. A unit vector has the original direction and length one.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Scaling changes length; a minus sign also reverses direction</text>
<line x1="380.00" y1="105.00" x2="580.00" y2="105.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="380.00" cy="105.00" r="4.5" fill="#20394d"/>
<text x="380.00" y="105.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700"></text>
<text x="48.00" y="87.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">a: length 2</text>
<line x1="380.00" y1="180.00" x2="780.00" y2="180.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="380.00" cy="180.00" r="4.5" fill="#20394d"/>
<text x="380.00" y="180.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700"></text>
<text x="48.00" y="162.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">2a: length 4</text>
<line x1="380.00" y1="255.00" x2="180.00" y2="255.00" stroke="#a04c13" stroke-width="3" stroke-linecap="round" marker-end="url(#orange)"/>
<circle cx="380.00" cy="255.00" r="4.5" fill="#20394d"/>
<text x="380.00" y="255.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700"></text>
<text x="48.00" y="237.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">−a: length 2, opposite direction</text>
<line x1="380.00" y1="330.00" x2="480.00" y2="330.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="380.00" cy="330.00" r="4.5" fill="#20394d"/>
<text x="380.00" y="330.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700"></text>
<text x="48.00" y="312.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">a / |a|: length 1</text>
</svg>