<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Side view: the normal makes a right angle with the plane</title><desc id="desc">A true edge-on view of a plane and its perpendicular normal.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Side view: the normal makes a right angle with the plane</text>
<line x1="180.00" y1="265.00" x2="820.00" y2="265.00" stroke="#718594" stroke-width="2.4" stroke-linecap="round"/>
<line x1="350.00" y1="265.00" x2="350.00" y2="85.00" stroke="#20394d" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ink)"/>
<line x1="350.00" y1="265.00" x2="740.00" y2="265.00" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<path d="M350 240L375 240L375 265" fill="none" stroke="#20394d" stroke-width="2.2"/>
<circle cx="350.00" cy="265.00" r="4.5" fill="#20394d"/>
<text x="328.00" y="291.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<text x="365.00" y="90.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">normal n</text>
<text x="385.00" y="233.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">90°</text>
<text x="565.00" y="300.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">a direction along the plane</text>
<text x="500.00" y="362.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The whole plane looks like one line when we look along its edge.</text>
</svg>