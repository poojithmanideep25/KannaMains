<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q16: equal side lengths give perpendicular diagonals</title><desc id="desc">A true view in the plane of the two vectors. Dashed sides are translated copies; angles and relative lengths come from the supplied vectors.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q16: equal side lengths give perpendicular diagonals</text>
<polygon points="155.00,374.51 541.40,374.51 845.00,135.49 458.60,135.49" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.6"/>
<line x1="155.00" y1="374.51" x2="541.40" y2="374.51" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="155.00" y1="374.51" x2="458.60" y2="135.49" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="155.00" cy="374.51" r="4.5" fill="#20394d"/>
<text x="131.00" y="398.51" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<circle cx="541.40" cy="374.51" r="4.5" fill="#20394d"/>
<text x="551.40" y="398.51" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">a</text>
<circle cx="458.60" cy="135.49" r="4.5" fill="#20394d"/>
<text x="438.60" y="121.49" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">b</text>
<line x1="541.40" y1="374.51" x2="845.00" y2="135.49" stroke="#718594" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#gray)"/>
<line x1="458.60" y1="135.49" x2="845.00" y2="135.49" stroke="#718594" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#gray)"/>
<line x1="155.00" y1="374.51" x2="845.00" y2="135.49" stroke="#a04c13" stroke-width="3" stroke-linecap="round" marker-end="url(#orange)"/>
<line x1="458.60" y1="135.49" x2="541.40" y2="374.51" stroke="#20394d" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/>
<path d="M514.17,250.09 L519.08,264.26 L504.91,269.17" fill="none" stroke="#20394d" stroke-width="2"/>
<text x="859.00" y="123.49" font-family="Arial,sans-serif" font-size="20" fill="#a04c13" text-anchor="start" font-weight="400">a + b</text>
<text x="515.00" y="305.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">a − b</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Sum and difference are perpendicular diagonals.</text>
</svg>