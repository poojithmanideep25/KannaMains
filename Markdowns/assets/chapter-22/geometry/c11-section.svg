<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Internal division: one part, then two parts</title><desc id="desc">Collinear points are placed in the stated exact segment ratio.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Internal division: one part, then two parts</text>
<line x1="150.00" y1="140.00" x2="850.00" y2="140.00" stroke="#20394d" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.00" cy="140.00" r="4.5" fill="#20394d"/>
<text x="145.00" y="122.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<circle cx="383.33" cy="140.00" r="4.5" fill="#20394d"/>
<text x="378.33" y="122.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">P</text>
<circle cx="850.00" cy="140.00" r="4.5" fill="#20394d"/>
<text x="845.00" y="122.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<text x="266.67" y="190.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">AP</text>
<text x="616.67" y="190.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="middle" font-weight="400">PB</text>
<text x="500.00" y="282.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Read the ratio in the order AP : PB.</text>
</svg>