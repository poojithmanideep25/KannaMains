<circle cx="622.13" cy="295.15" r="4.5" fill="#20394d"/>
<text x="634.13" y="317.15" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">a</text>
<line x1="455.16" y1="410.00" x2="377.87" y2="356.83" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="377.87" cy="356.83" r="4.5" fill="#20394d"/>
<text x="355.87" y="356.83" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">d</text>
<line x1="622.13" y1="295.15" x2="544.84" y2="241.98" stroke="#718594" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="377.87" y1="356.83" x2="544.84" y2="241.98" stroke="#718594" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="455.16" y1="410.00" x2="455.16" y2="100.00" stroke="#20394d" stroke-width="3.3" stroke-linecap="round" marker-end="url(#ink)"/>
<circle cx="455.16" cy="410.00" r="4.5" fill="#20394d"/>
<text x="431.16" y="430.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<text x="467.16" y="92.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">a × d</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The normal is perpendicular to both input arrows. Its drawn length only shows direction.</text>
