<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q21: add arrows of lengths 2 and 3 at 60°</title><desc id="desc">A true view in the plane of the two vectors. Dashed sides are translated copies; angles and relative lengths come from the supplied vectors.</desc>
<defs>
