<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">A normal points straight out of a plane</title><desc id="desc">Left: a normal arrow from A is perpendicular to a plane containing A, B and C. Right: an edge-on view shows a 90 degree angle between the normal and an arrow along the plane.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#155e82"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a04c13"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="263.00" y="36.00" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="bold">A stick straight out of the sheet</text>
<polygon points="211.82,360.44 451.88,291.14 342.98,196.83 102.92,266.13" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.6"/>
<line x1="223.46" y1="334.22" x2="409.22" y2="280.60" stroke="#155e82" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="223.46" y1="334.22" x2="164.70" y2="263.54" stroke="#155e82" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="223.46" y1="334.22" x2="223.46" y2="165.61" stroke="#20394d" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<circle cx="223.46" cy="334.22" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="200.46" y="354.22" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">A</text>
<circle cx="409.22" cy="280.60" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="419.22" y="294.60" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">B</text>
<circle cx="164.70" cy="263.54" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="144.70" y="253.54" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">C</text>
<text x="235.46" y="168.61" font-family="Arial, sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="bold">normal n</text>
<text x="780.00" y="36.00" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="bold">Side view: a clear right angle</text>
<line x1="582.00" y1="336.00" x2="977.00" y2="336.00" stroke="#98adbc" stroke-width="3" stroke-linecap="round"/>
<line x1="665.00" y1="336.00" x2="665.00" y2="112.00" stroke="#20394d" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<line x1="665.00" y1="336.00" x2="948.00" y2="336.00" stroke="#a04c13" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<path d="M 665 309 L 692 309 L 692 336" fill="none" stroke="#20394d" stroke-width="2.3"/>
<circle cx="665.00" cy="336.00" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="643.00" y="363.00" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">A</text>
<circle cx="948.00" cy="336.00" r="4.8" fill="#a04c13" stroke="#a04c13" stroke-width="2"/>
<text x="958.00" y="345.00" font-family="Arial, sans-serif" font-size="20" fill="#a04c13" text-anchor="start" font-weight="bold">D</text>
<text x="679.00" y="120.00" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">normal n</text>
<text x="699.00" y="303.00" font-family="Arial, sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="normal">90°</text>
<text x="780.00" y="370.00" font-family="Arial, sans-serif" font-size="18" fill="#a04c13" text-anchor="middle" font-weight="normal">A to D stays along the sheet</text>
<text x="780.00" y="410.00" font-family="Arial, sans-serif" font-size="17" fill="#7b8c99" text-anchor="middle" font-weight="normal">The sheet looks like a line in this side view.</text>
<text x="264.00" y="420.00" font-family="Arial, sans-serif" font-size="17" fill="#7b8c99" text-anchor="middle" font-weight="normal">A normal is perpendicular to the whole plane.</text>
