<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Cross product: a new arrow out of the plane</title><desc id="desc">Orthographic view of the actual two-vector plane. The normal arrow indicates direction; its drawn length is chosen for clarity.</desc>
