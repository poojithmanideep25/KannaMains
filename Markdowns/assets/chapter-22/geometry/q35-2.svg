<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Three movements from A</title><desc id="desc">A is the shared starting point. Arrows A to B, A to C and A to D stay in the flat sheet when all four points are coplanar.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#155e82"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a04c13"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.00" y="37.00" font-family="Arial, sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="bold">Start all three arrows at A</text>
<polygon points="426.00,348.14 727.90,260.99 590.95,142.38 289.05,229.53" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.6"/>
<line x1="440.63" y1="315.16" x2="674.24" y2="247.72" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="440.63" y1="315.16" x2="366.75" y2="226.27" stroke="#155e82" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="440.63" y1="315.16" x2="550.90" y2="211.45" stroke="#a04c13" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
<circle cx="440.63" cy="315.16" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="414.63" y="335.16" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">A</text>
<circle cx="674.24" cy="247.72" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="686.24" y="259.72" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">B</text>
<circle cx="366.75" cy="226.27" r="4.8" fill="#20394d" stroke="#20394d" stroke-width="2"/>
<text x="348.75" y="212.27" font-family="Arial, sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="bold">C</text>
<circle cx="550.90" cy="211.45" r="4.8" fill="#a04c13" stroke="#a04c13" stroke-width="2"/>
<text x="562.90" y="205.45" font-family="Arial, sans-serif" font-size="20" fill="#a04c13" text-anchor="start" font-weight="bold">D</text>
<text x="323.69" y="266.71" font-family="Arial, sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="normal">A to C</text>
<text x="567.44" y="305.44" font-family="Arial, sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="normal">A to B</text>
<text x="505.76" y="249.30" font-family="Arial, sans-serif" font-size="19" fill="#a04c13" text-anchor="start" font-weight="normal">A to D</text>
<text x="500.00" y="402.00" font-family="Arial, sans-serif" font-size="18" fill="#7b8c99" text-anchor="middle" font-weight="normal">Each arrow is a movement between two points on the sheet.</text>
</svg>