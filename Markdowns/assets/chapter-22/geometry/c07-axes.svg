<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Three coordinate axes and one vector</title><desc id="desc">Explicit orthographic drawing of positive xyz axes and a vector (2,1,2). Its apparent screen angles are perspective projections.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Three coordinate axes and one vector</text>
<line x1="456.33" y1="306.67" x2="662.99" y2="366.33" stroke="#718594" stroke-width="2.3" stroke-linecap="round" marker-end="url(#gray)"/>
<text x="674.99" y="382.33" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">+x</text>
<line x1="456.33" y1="306.67" x2="337.01" y2="410.00" stroke="#718594" stroke-width="2.3" stroke-linecap="round" marker-end="url(#gray)"/>
<text x="307.01" y="434.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">+y</text>
<line x1="456.33" y1="306.67" x2="456.33" y2="100.00" stroke="#718594" stroke-width="2.3" stroke-linecap="round" marker-end="url(#gray)"/>
<text x="466.33" y="92.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">+z</text>
<line x1="456.33" y1="306.67" x2="554.33" y2="243.11" stroke="#a04c13" stroke-width="3.2" stroke-linecap="round" marker-end="url(#orange)"/>
<circle cx="554.33" cy="243.11" r="4.5" fill="#a04c13"/>
<text x="566.33" y="231.11" font-family="Arial,sans-serif" font-size="20" fill="#a04c13" text-anchor="start" font-weight="700">a = (2, 1, 2)</text>
<line x1="554.33" y1="380.88" x2="554.33" y2="243.11" stroke="#718594" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="456.33" y1="306.67" x2="554.33" y2="380.88" stroke="#718594" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="456.33" cy="306.67" r="4.5" fill="#20394d"/>
<text x="431.33" y="331.67" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">O</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The coordinate axes are perpendicular in space; screen angles may look different.</text>
</svg>