<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">External division puts P outside the segment AB</title><desc id="desc">Two collinear examples: P beyond B for AP:PB=2:1; P before A for AP:PB=1:2.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#155e82"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a04c13"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718594"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="33.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">External division puts P outside the segment AB</text>
<text x="500.00" y="95.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">AP : PB = 2 : 1</text>
<line x1="180.00" y1="150.00" x2="820.00" y2="150.00" stroke="#718594" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.00" cy="150.00" r="4.5" fill="#20394d"/>
<text x="214.00" y="178.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<circle cx="500.00" cy="150.00" r="4.5" fill="#20394d"/>
<text x="494.00" y="178.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<circle cx="780.00" cy="150.00" r="4.5" fill="#20394d"/>
<text x="774.00" y="178.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">P</text>
<text x="500.00" y="240.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">AP : PB = 1 : 2</text>
<line x1="180.00" y1="295.00" x2="820.00" y2="295.00" stroke="#718594" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.00" cy="295.00" r="4.5" fill="#20394d"/>
<text x="214.00" y="323.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">P</text>
<circle cx="500.00" cy="295.00" r="4.5" fill="#20394d"/>
<text x="494.00" y="323.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<circle cx="780.00" cy="295.00" r="4.5" fill="#20394d"/>
<text x="774.00" y="323.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
</svg>