<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">Distinct real roots: the parameter must stay outside</title><desc id="desc">The complete allowed set is m&lt;-6 or m&gt;6. The boundary values give repeated roots.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Distinct real roots: the parameter must stay outside</text>
<text x="500.00" y="100.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">m² − 36 &gt; 0 means |m| &gt; 6</text>
<line x1="150.00" y1="175.00" x2="850.00" y2="175.00" stroke="#718594" stroke-width="1.5"/>
<line x1="266.67" y1="171.00" x2="266.67" y2="179.00" stroke="#718594" stroke-width="1"/>
<text x="266.67" y="203.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">−6</text>
<line x1="500.00" y1="171.00" x2="500.00" y2="179.00" stroke="#718594" stroke-width="1"/>
<text x="500.00" y="203.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<line x1="733.33" y1="171.00" x2="733.33" y2="179.00" stroke="#718594" stroke-width="1"/>
<text x="733.33" y="203.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">6</text>
<line x1="150.00" y1="175.00" x2="266.67" y2="175.00" stroke="#155e82" stroke-width="3.4"/>
<line x1="266.67" y1="175.00" x2="150.00" y2="175.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="266.67" cy="175.00" r="4.8" fill="white" stroke="#155e82" stroke-width="2"/>
<line x1="733.33" y1="175.00" x2="850.00" y2="175.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="733.33" cy="175.00" r="4.8" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="500.00" y="275.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">At m = −6 or 6: Δ = 0, so the roots are equal.</text>
<text x="500.00" y="352.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Hollow points exclude the equality cases. Both outer rays are needed.</text>
</svg>