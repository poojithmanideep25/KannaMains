<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Both negative roots: intersect all three conditions</title><desc id="desc">The allowed parameter set is (5/9,1] union [6,infinity). Repeated negative roots at 1 and 6 are allowed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Both negative roots: intersect all three conditions</text>
<line x1="300.00" y1="135.00" x2="900.00" y2="135.00" stroke="#718594" stroke-width="1.5"/>
<text x="45.00" y="142.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Real: Δ ≥ 0</text>
<line x1="480.00" y1="131.00" x2="480.00" y2="139.00" stroke="#718594" stroke-width="1"/>
<text x="480.00" y="163.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">1</text>
<line x1="780.00" y1="131.00" x2="780.00" y2="139.00" stroke="#718594" stroke-width="1"/>
<text x="780.00" y="163.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">6</text>
<line x1="300.00" y1="135.00" x2="480.00" y2="135.00" stroke="#155e82" stroke-width="3.4"/>
<line x1="480.00" y1="135.00" x2="300.00" y2="135.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="480.00" cy="135.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<line x1="780.00" y1="135.00" x2="900.00" y2="135.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="780.00" cy="135.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<line x1="300.00" y1="245.00" x2="900.00" y2="245.00" stroke="#718594" stroke-width="1.5"/>
<text x="45.00" y="252.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Sum &lt; 0</text>
<line x1="360.00" y1="241.00" x2="360.00" y2="249.00" stroke="#718594" stroke-width="1"/>
<text x="360.00" y="273.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">−1</text>
<line x1="360.00" y1="245.00" x2="900.00" y2="245.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="360.00" cy="245.00" r="4.8" fill="white" stroke="#155e82" stroke-width="2"/>
<line x1="300.00" y1="355.00" x2="900.00" y2="355.00" stroke="#718594" stroke-width="1.5"/>
<text x="45.00" y="362.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Product &gt; 0</text>
<line x1="453.33" y1="351.00" x2="453.33" y2="359.00" stroke="#718594" stroke-width="1"/>
<text x="453.33" y="383.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">5/9</text>
<line x1="453.33" y1="355.00" x2="900.00" y2="355.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="453.33" cy="355.00" r="4.8" fill="white" stroke="#155e82" stroke-width="2"/>
<line x1="300.00" y1="465.00" x2="900.00" y2="465.00" stroke="#718594" stroke-width="1.5"/>
<text x="45.00" y="472.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">All together</text>
<line x1="453.33" y1="461.00" x2="453.33" y2="469.00" stroke="#718594" stroke-width="1"/>
<text x="453.33" y="493.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">5/9</text>
<line x1="480.00" y1="461.00" x2="480.00" y2="469.00" stroke="#718594" stroke-width="1"/>
<text x="480.00" y="493.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">1</text>
<line x1="780.00" y1="461.00" x2="780.00" y2="469.00" stroke="#718594" stroke-width="1"/>
<text x="780.00" y="493.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">6</text>
<line x1="453.33" y1="465.00" x2="480.00" y2="465.00" stroke="#155e82" stroke-width="3.4"/>
<circle cx="453.33" cy="465.00" r="4.8" fill="white" stroke="#155e82" stroke-width="2"/>
<circle cx="480.00" cy="465.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<line x1="780.00" y1="465.00" x2="900.00" y2="465.00" stroke="#155e82" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="780.00" cy="465.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="500.00" y="572.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">5/9 is excluded because one root becomes zero. Equality in the discriminant is allowed.</text>
</svg>