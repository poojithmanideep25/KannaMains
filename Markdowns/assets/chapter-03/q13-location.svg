<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Strict root intervals exclude their boundary cases</title><desc id="desc">Actual roots are k-1 and k+1. The middle example fits; boundary examples put a root on an excluded endpoint.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Strict root intervals exclude their boundary cases</text>
<rect x="335.0" y="90" width="450.0" height="380" rx="0" fill="#f3f8fa" stroke="none" stroke-width="1.5"/>
<line x1="335.00" y1="90.00" x2="335.00" y2="470.00" stroke="#718594" stroke-width="1.4" stroke-dasharray="7 5"/>
<line x1="785.00" y1="90.00" x2="785.00" y2="470.00" stroke="#718594" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="45.00" y="161.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">k = −1: fails</text>
<line x1="260.00" y1="155.00" x2="860.00" y2="155.00" stroke="#718594" stroke-width="1.3"/>
<line x1="328.00" y1="148.00" x2="342.00" y2="162.00" stroke="#a04c13" stroke-width="3"/>
<line x1="328.00" y1="162.00" x2="342.00" y2="148.00" stroke="#a04c13" stroke-width="3"/>
<text x="335.00" y="185.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">−2</text>
<circle cx="485.00" cy="155.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="485.00" y="185.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<text x="45.00" y="291.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">k = 1: fits</text>
<line x1="260.00" y1="285.00" x2="860.00" y2="285.00" stroke="#718594" stroke-width="1.3"/>
<circle cx="485.00" cy="285.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="485.00" y="315.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<circle cx="635.00" cy="285.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="635.00" y="315.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<text x="45.00" y="421.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">k = 3: fails</text>
<line x1="260.00" y1="415.00" x2="860.00" y2="415.00" stroke="#718594" stroke-width="1.3"/>
<circle cx="635.00" cy="415.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="635.00" y="445.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<line x1="778.00" y1="408.00" x2="792.00" y2="422.00" stroke="#a04c13" stroke-width="3"/>
<line x1="778.00" y1="422.00" x2="792.00" y2="408.00" stroke="#a04c13" stroke-width="3"/>
<text x="785.00" y="445.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">4</text>
<text x="335.00" y="505.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">−2 excluded</text>
<text x="785.00" y="505.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">4 excluded</text>
<text x="500.00" y="542.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">For all valid cases: k−1 &gt; −2 and k+1 &lt; 4, so −1 &lt; k &lt; 3.</text>
</svg>