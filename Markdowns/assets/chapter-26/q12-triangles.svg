<text x="115.00" y="315.00" font-family="Arial,sans-serif" font-size="18" fill="#a04c13" text-anchor="start" font-weight="400">A</text>
<text x="360.00" y="105.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="700">B=arccos(12/13)</text>
<line x1="360.00" y1="365.00" x2="580.00" y2="365.00" stroke="#20394d" stroke-width="2"/>
<line x1="580.00" y1="365.00" x2="580.00" y2="273.33" stroke="#20394d" stroke-width="2"/>
