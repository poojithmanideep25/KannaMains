<text x="592.00" y="324.17" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">5</text>
<text x="470.00" y="294.17" font-family="Arial,sans-serif" font-size="18" fill="#155e82" text-anchor="middle" font-weight="400">13</text>
