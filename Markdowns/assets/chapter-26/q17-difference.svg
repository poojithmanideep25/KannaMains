<text x="400.00" y="315.00" font-family="Arial,sans-serif" font-size="18" fill="#a04c13" text-anchor="start" font-weight="400">B</text>
<text x="675.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">sin A=3/5;sin B=8/17.</text>
<text x="675.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Because3/5&gt;8/17,A&gt;B.</text>
<text x="675.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">sin(A−B)=(45−32)/85.</text>
<text x="675.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The positive difference is acute.</text>
<text x="675.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">So arcsin returns A−B.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The right-angle square joins the two legs. Each triangle has equal horizontal/vertical units within its panel.</text>
