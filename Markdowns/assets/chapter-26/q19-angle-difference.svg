<text x="294.00" y="154.15" font-family="Arial,sans-serif" font-size="19" fill="#a33434" text-anchor="start" font-weight="400">P</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">B=arccos(y/2).</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A=B+π/3 must remain in[0,π].</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Thus0≤B≤2π/3.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The curve shows permitted pairs.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P=(0,√3) is one compatible example.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Every pair on this arc gives</text>
<text x="635.00" y="370.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">4x²−2xy+y²=3.</text>
<text x="635.00" y="410.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The full quadratic has extra points.</text>
<text x="290.00" y="610.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">Equal units on x and y axes</text>
<text x="500.00" y="682.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The source does not specify a unique pair. The original principal-angle equation selects this arc.</text>
