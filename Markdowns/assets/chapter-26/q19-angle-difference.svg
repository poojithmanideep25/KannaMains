<title id="title">Q19: the original angle relation gives a restricted family of pairs</title><desc id="desc">Exact parametrization x=cos(B+π/3),y=2cosB with0≤B≤2π/3;equal coordinate units,not the unrestricted full quadratic curve.</desc>
