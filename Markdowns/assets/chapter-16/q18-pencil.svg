<line x1="85.00" y1="352.78" x2="253.52" y2="100.00" stroke="#a04c13" stroke-width="2.5"/>
<line x1="85.00" y1="187.50" x2="357.22" y2="255.56" stroke="#718594" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="179.44" cy="211.11" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="151.44" y="197.11" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P</text>
<circle cx="279.44" cy="411.11" r="4.8" fill="#a33434" stroke="#a33434" stroke-width="2"/>
<text x="294.44" y="421.11" font-family="Arial,sans-serif" font-size="19" fill="#a33434" text-anchor="start" font-weight="400">Q</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units on both axes; all positions come from the stated geometry.</text>
