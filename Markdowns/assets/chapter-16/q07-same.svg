<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q7: two equations can describe the same line</title><desc id="desc">Both source equations have exactly the same solution points.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q7: two equations can describe the same line</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="437.5" height="350.0"/></clipPath></defs>
<line x1="172.50" y1="450.00" x2="172.50" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="362.50" x2="522.50" y2="362.50" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="534.50" y="368.50" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="182.50" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">x + 2y = 3</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">2x + 4y = 6</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Divide the second by 2.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Both describe this one line.</text>
<line x1="85.00" y1="187.50" x2="522.50" y2="406.25" stroke="#155e82" stroke-width="2.5"/>
<circle cx="435.00" cy="362.50" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="423.00" y="387.50" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">(3,0)</text>
<circle cx="172.50" cy="231.25" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="186.50" y="219.25" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">(0,3/2)</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units on both axes; all positions come from the stated geometry.</text>
</svg>