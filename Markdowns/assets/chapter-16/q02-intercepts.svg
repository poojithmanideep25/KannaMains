<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q2: equal intercepts make a right triangle</title><desc id="desc">Actual axis intercept triangle with the supplied point on its sloping side.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q2: equal intercepts make a right triangle</text>
<polygon clip-path="url(#plot1)" points="122.69,412.31 391.92,412.31 122.69,143.08" fill="#dcecf4" stroke="none"/>
<defs><clipPath id="plot1"><rect x="85" y="100" width="350.0" height="350.0"/></clipPath></defs>
<line x1="122.69" y1="450.00" x2="122.69" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="412.31" x2="435.00" y2="412.31" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="447.00" y="418.31" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="132.69" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P = (2,3)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A = (a,0); B = (0,a)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The line is x + y = a.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Use P to find a.</text>
