<text x="298.25" y="228.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">H₁</text>
<circle cx="220.62" cy="327.50" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="186.62" y="347.50" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">H₂</text>
<line x1="277.85" y1="251.20" x2="289.05" y2="259.60" stroke="#20394d" stroke-width="1.5"/>
<line x1="289.05" y1="259.60" x2="297.45" y2="248.40" stroke="#20394d" stroke-width="1.5"/>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units on both axes; all positions come from the stated geometry.</text>
