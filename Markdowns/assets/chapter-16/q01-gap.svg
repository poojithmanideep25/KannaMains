<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q1: measure the gap along a common perpendicular</title><desc id="desc">Original parallel lines with normalized common normal(3,4).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q1: measure the gap along a common perpendicular</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="350.0" height="350.0"/></clipPath></defs>
<line x1="260.00" y1="450.00" x2="260.00" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="275.00" x2="435.00" y2="275.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="447.00" y="281.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="270.00" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Blue: 3x + 4y = 5</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Orange: 3x + 4y = −15/2</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Same normal direction: (3,4)</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The red segment is the gap.</text>
