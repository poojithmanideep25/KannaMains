<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q5: concurrency means all three lines share one point</title><desc id="desc">Three actual source lines with k−2 pass throughP(−1,2).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q5: concurrency means all three lines share one point</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="300.0" height="350.0"/></clipPath></defs>
<line x1="235.00" y1="450.00" x2="235.00" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="350.00" x2="385.00" y2="350.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="397.00" y="356.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="245.00" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Blue: x + 2y = 3</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Orange: 2x − y = −4</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Dashed: 3x − 2y = −7</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Find the first intersection.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Then test it in line 3.</text>
<line x1="85.00" y1="200.00" x2="385.00" y2="350.00" stroke="#155e82" stroke-width="2.5"/>
<line x1="85.00" y1="450.00" x2="260.00" y2="100.00" stroke="#a04c13" stroke-width="2.5"/>
<line x1="85.00" y1="400.00" x2="285.00" y2="100.00" stroke="#718594" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="185.00" cy="250.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="210.00" y="255.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P(−1,2)</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units on both axes; all positions come from the stated geometry.</text>
</svg>