<text x="760.00" y="148.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">2</text>
<line x1="270.00" y1="140.00" x2="470.00" y2="140.00" stroke="#20394d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="370.00" y="122.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">apply g</text>
<line x1="530.00" y1="140.00" x2="730.00" y2="140.00" stroke="#20394d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="630.00" y="122.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">apply f</text>
