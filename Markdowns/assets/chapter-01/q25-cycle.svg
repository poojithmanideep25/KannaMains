<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Three applications return to the starting value</title><desc id="desc">The actual orbit 5 to minus one-quarter to four-fifths to 5 under f(x)=1/(1-x).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Three applications return to the starting value</text>
<line x1="476.35" y1="135.80" x2="303.65" y2="324.20" stroke="#20394d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.00" y="230.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">apply f</text>
<line x1="315.00" y1="350.00" x2="685.00" y2="350.00" stroke="#20394d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.00" y="332.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">apply f</text>
<line x1="696.35" y1="324.20" x2="523.65" y2="135.80" stroke="#20394d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="670.00" y="230.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">apply f</text>
<circle cx="500.00" cy="110.00" r="34" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<text x="500.00" y="118.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">5</text>
<circle cx="280.00" cy="350.00" r="34" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<text x="280.00" y="358.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">−1/4</text>
<circle cx="720.00" cy="350.00" r="34" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<text x="720.00" y="358.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">4/5</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">This is a composition cycle of length 3, not a horizontal graph period.</text>
</svg>