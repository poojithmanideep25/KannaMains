<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Transitive: two linked steps require a direct link</title><desc id="desc">The given arrows are 1 to 2 and 2 to 3. Transitivity forces the dashed arrow 1 to 3.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Transitive: two linked steps require a direct link</text>
<line x1="224.00" y1="210.00" x2="476.00" y2="210.00" stroke="#155e82" stroke-width="2.7" marker-end="url(#arrow)"/>
<line x1="524.00" y1="210.00" x2="776.00" y2="210.00" stroke="#155e82" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M200 185 C200 65 800 65 800 185" fill="none" stroke="#a04c13" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
<circle cx="200.00" cy="210.00" r="24" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<text x="200.00" y="218.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">1</text>
<circle cx="500.00" cy="210.00" r="24" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<text x="500.00" y="218.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">2</text>
<circle cx="800.00" cy="210.00" r="24" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<text x="800.00" y="218.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">3</text>
<text x="350.00" y="191.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="middle" font-weight="400">given</text>
<text x="650.00" y="191.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="middle" font-weight="400">given</text>
<text x="500.00" y="82.00" font-family="Arial,sans-serif" font-size="20" fill="#a04c13" text-anchor="middle" font-weight="400">direct link also required</text>
<text x="500.00" y="332.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Solid arrows: given pairs. Dashed arrow: the pair forced by transitivity.</text>
</svg>