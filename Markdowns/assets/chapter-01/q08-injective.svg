<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">One-one: different inputs must use different targets</title><desc id="desc">An example injective map from three inputs to six targets. Unused targets are allowed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">One-one: different inputs must use different targets</text>
<text x="500.00" y="75.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="700">Example: 1 → 2, 2 → 4, 3 → 6</text>
<ellipse cx="190" cy="255" rx="70" ry="135" fill="#edf3f7" stroke="#155e82" stroke-width="1.6"/><ellipse cx="810" cy="255" rx="70" ry="135" fill="#edf3f7" stroke="#155e82" stroke-width="1.6"/>
<line x1="208.00" y1="200.00" x2="792.00" y2="192.00" stroke="#20394d" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="208.00" y1="255.00" x2="792.00" y2="276.00" stroke="#20394d" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="208.00" y1="310.00" x2="792.00" y2="360.00" stroke="#20394d" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="190.00" y="206.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">1</text>
<text x="190.00" y="261.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">2</text>
<text x="190.00" y="316.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">3</text>
<text x="810.00" y="156.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">1</text>
<text x="810.00" y="198.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">2</text>
<text x="810.00" y="240.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">3</text>
<text x="810.00" y="282.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">4</text>
<text x="810.00" y="324.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">5</text>
<text x="810.00" y="366.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">6</text>
<text x="190.00" y="410.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">input set A</text>
<text x="810.00" y="410.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">target set B</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The first input has 6 choices, the next has 5, and the last has 4.</text>
</svg>