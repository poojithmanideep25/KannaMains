<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Equivalence relations are ways to split the set into groups</title><desc id="desc">Five block-size patterns partition a four-member set. Group order is irrelevant.</desc>
