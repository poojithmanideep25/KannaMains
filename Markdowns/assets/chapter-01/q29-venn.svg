<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Exactly one: 27 in the left region, 14 in the right</title><desc id="desc">A two-set Venn diagram. Labels give counts or members; circle areas do not measure cardinality.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Exactly one: 27 in the left region, 14 in the right</text>
<rect x="140" y="70" width="720" height="300" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<circle cx="410.00" cy="225.00" r="145" fill="#e4eef4" stroke="#155e82" stroke-width="2"/>
<circle cx="590.00" cy="225.00" r="145" fill="none" stroke="#155e82" stroke-width="2"/>
<text x="310.00" y="110.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">multiples of 3</text>
<text x="680.00" y="110.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">multiples of 5</text>
<text x="340.00" y="235.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="700">27</text>
<text x="500.00" y="235.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="700">6</text>
<text x="660.00" y="235.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="700">14</text>
<text x="790.00" y="345.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">53 neither</text>
<text x="500.00" y="422.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Left only | shared part | right only. Counts come from labels, not circle size.</text>
