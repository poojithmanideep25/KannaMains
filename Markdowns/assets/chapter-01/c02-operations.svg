<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">Read a set operation as a shaded region</title><desc id="desc">Four two-set regions: union, intersection, A minus B, and complement of A relative to U.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Read a set operation as a shaded region</text>
<text x="250.00" y="75.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="700">A ∪ B: either set, including both</text>
<rect x="55" y="98" width="390" height="240" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<defs><clipPath id="A0"><circle cx="195" cy="210" r="105"/></clipPath><mask id="notB0"><rect width="1000" height="710" fill="white"/><circle cx="305" cy="210" r="105" fill="black"/></mask><mask id="notA0"><rect width="1000" height="710" fill="white"/><circle cx="195" cy="210" r="105" fill="black"/></mask></defs>
<circle cx="195.00" cy="210.00" r="105" fill="#a9cadb" stroke="none" stroke-width="2"/>
<circle cx="305.00" cy="210.00" r="105" fill="#a9cadb" stroke="none" stroke-width="2"/>
<circle cx="195.00" cy="210.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<circle cx="305.00" cy="210.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<text x="150.00" y="155.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<text x="340.00" y="155.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<text x="65.00" y="120.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">U</text>
<text x="750.00" y="75.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="700">A ∩ B: in both sets</text>
<rect x="555" y="98" width="390" height="240" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<defs><clipPath id="A1"><circle cx="695" cy="210" r="105"/></clipPath><mask id="notB1"><rect width="1000" height="710" fill="white"/><circle cx="805" cy="210" r="105" fill="black"/></mask><mask id="notA1"><rect width="1000" height="710" fill="white"/><circle cx="695" cy="210" r="105" fill="black"/></mask></defs>
<circle cx="805" cy="210" r="105" fill="#a9cadb" clip-path="url(#A1)"/>
<circle cx="695.00" cy="210.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<circle cx="805.00" cy="210.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<text x="650.00" y="155.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<text x="840.00" y="155.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<text x="565.00" y="120.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">U</text>
<text x="250.00" y="395.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="700">A minus B: in A, outside B</text>
<rect x="55" y="418" width="390" height="240" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<defs><clipPath id="A2"><circle cx="195" cy="530" r="105"/></clipPath><mask id="notB2"><rect width="1000" height="710" fill="white"/><circle cx="305" cy="530" r="105" fill="black"/></mask><mask id="notA2"><rect width="1000" height="710" fill="white"/><circle cx="195" cy="530" r="105" fill="black"/></mask></defs>
<circle cx="195" cy="530" r="105" fill="#a9cadb" mask="url(#notB2)"/>
<circle cx="195.00" cy="530.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<circle cx="305.00" cy="530.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<text x="150.00" y="475.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<text x="340.00" y="475.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<text x="65.00" y="440.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">U</text>
<text x="750.00" y="395.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="700">A complement: outside A in U</text>
<rect x="555" y="418" width="390" height="240" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<defs><clipPath id="A3"><circle cx="695" cy="530" r="105"/></clipPath><mask id="notB3"><rect width="1000" height="710" fill="white"/><circle cx="805" cy="530" r="105" fill="black"/></mask><mask id="notA3"><rect width="1000" height="710" fill="white"/><circle cx="695" cy="530" r="105" fill="black"/></mask></defs>
<rect x="555" y="418" width="390" height="240" fill="#a9cadb" mask="url(#notA3)"/>
<circle cx="695.00" cy="530.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<circle cx="805.00" cy="530.00" r="105" fill="none" stroke="#155e82" stroke-width="2"/>
<text x="650.00" y="475.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<text x="840.00" y="475.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<text x="565.00" y="440.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">U</text>
</svg>