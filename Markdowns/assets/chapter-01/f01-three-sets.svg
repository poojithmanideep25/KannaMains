<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">Three sets have seven separate inside regions</title><desc id="desc">Each lower-case letter denotes one disjoint region; t is the three-set overlap.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Three sets have seven separate inside regions</text>
<rect x="140" y="65" width="720" height="515" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<circle cx="390.00" cy="240.00" r="170" fill="none" stroke="#155e82" stroke-width="2"/>
<circle cx="610.00" cy="240.00" r="170" fill="none" stroke="#155e82" stroke-width="2"/>
<circle cx="500.00" cy="390.00" r="170" fill="none" stroke="#155e82" stroke-width="2"/>
<text x="275.00" y="135.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">A</text>
<text x="725.00" y="135.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">B</text>
<text x="510.00" y="545.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">C</text>
<text x="280.00" y="235.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">p</text>
<text x="720.00" y="235.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">q</text>
<text x="500.00" y="510.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">r</text>
<text x="500.00" y="135.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">u</text>
<text x="370.00" y="385.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">v</text>
<text x="630.00" y="385.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">w</text>
<text x="500.00" y="300.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">t</text>
<text x="500.00" y="622.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">p, q, r: one set only. u, v, w: exactly two sets. t: all three.</text>
</svg>