<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Q34 asks for two incompatible values at the same input</title><desc id="desc">Logicalcomparison:equationandfprime03forcef5e15butprintedf52.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q34 asks for two incompatible values at the same input</text>
<rect x="70" y="120" width="490" height="66" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="315.00" y="160.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">Given / derived requirement</text>
<rect x="560" y="120" width="370" height="66" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="745.00" y="160.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">Consequence</text>
<rect x="70" y="186" width="490" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="315.00" y="226.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">f(x+h)=f(x)f(h), f′(0)=3</text>
<rect x="560" y="186" width="370" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="745.00" y="226.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">f′(x)=3f(x)</text>
<rect x="70" y="252" width="490" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="315.00" y="292.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Also f(0)=1</text>
<rect x="560" y="252" width="370" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="745.00" y="292.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">f(x)=e³ˣ</text>
<rect x="70" y="318" width="490" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="315.00" y="358.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">At input x=5</text>
<rect x="560" y="318" width="370" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="745.00" y="358.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">f(5)=e¹⁵</text>
<rect x="70" y="384" width="490" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="315.00" y="424.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Separately printed in Q34</text>
<rect x="560" y="384" width="370" height="66" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="745.00" y="424.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">f(5)=2</text>
<text x="500.00" y="505.00" font-family="Arial,sans-serif" font-size="25" fill="#a33434" text-anchor="middle" font-weight="400">e¹⁵ ≠ 2: no function satisfies every printed condition.</text>
<text x="500.00" y="532.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The formal local computation gives the intended 6, but the global data are inconsistent.</text>
</svg>