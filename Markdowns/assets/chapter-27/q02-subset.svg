<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q2: every multiple of six is inside the multiples of three</title><desc id="desc">Schematic set containment,not probability or cardinality scale; example integers illustrate the general divisibility implication.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q2: every multiple of six is inside the multiples of three</text>
<rect x="65" y="100" width="500" height="350" rx="0" fill="white" stroke="#20394d" stroke-width="1.5"/>
<text x="85.00" y="128.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Universe: integers</text>
<rect x="100" y="150" width="365" height="235" rx="0" fill="#edf3f7" stroke="#155e82" stroke-width="1.5"/>
<text x="115.00" y="180.00" font-family="Arial,sans-serif" font-size="18" fill="#155e82" text-anchor="start" font-weight="400">B: multiples of 3</text>
<rect x="145" y="215" width="240" height="105" rx="0" fill="#fff1e4" stroke="#a04c13" stroke-width="1.5"/>
<text x="160.00" y="244.00" font-family="Arial,sans-serif" font-size="18" fill="#a04c13" text-anchor="start" font-weight="400">A: multiples of 6</text>
<text x="185.00" y="285.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">6, 12, 18</text>
<text x="115.00" y="355.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">B only: 3, 9, 15</text>
<text x="100.00" y="422.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Outside B: 1, 2, 4, 5, 7</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A lies entirely inside B.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">If n is outside B,it is also</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">outside A.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Not divisible by3 therefore means</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">not divisible by6.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The number9 is in B,but not A.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The rectangles show logical containment. Their areas do not encode counts.</text>
</svg>