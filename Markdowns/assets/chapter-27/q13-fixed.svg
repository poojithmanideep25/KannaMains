<text x="517.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">F</text>
<rect x="65" y="206" width="90" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(b)</text>
