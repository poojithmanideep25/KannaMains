<text x="167.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(F implies T)AND T</text>
<rect x="505" y="206" width="60" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="517.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">T</text>
<rect x="65" y="254" width="90" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(c)</text>
<rect x="155" y="254" width="350" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="167.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(T implies F)AND T</text>
<rect x="505" y="254" width="60" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="517.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">F</text>
<rect x="65" y="302" width="90" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
