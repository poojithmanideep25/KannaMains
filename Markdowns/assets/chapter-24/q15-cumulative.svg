<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q15: interpolate where the cumulative count reaches twenty</title><desc id="desc">Piecewise-linear grouped cumulative frequency using the original boundaries and counts; interpolation is an estimate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q15: interpolate where the cumulative count reaches twenty</text>
<defs><clipPath id="plot1"><rect x="85" y="125" width="480" height="300"/></clipPath></defs>
<line x1="85.00" y1="425.00" x2="85.00" y2="125.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="425.00" x2="565.00" y2="425.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="421.00" x2="85.00" y2="429.00" stroke="#718594" stroke-width="1"/>
<text x="85.00" y="448.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<line x1="181.00" y1="421.00" x2="181.00" y2="429.00" stroke="#718594" stroke-width="1"/>
<text x="181.00" y="448.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">10</text>
<line x1="277.00" y1="421.00" x2="277.00" y2="429.00" stroke="#718594" stroke-width="1"/>
<text x="277.00" y="448.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">20</text>
<line x1="373.00" y1="421.00" x2="373.00" y2="429.00" stroke="#718594" stroke-width="1"/>
<text x="373.00" y="448.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">30</text>
<line x1="469.00" y1="421.00" x2="469.00" y2="429.00" stroke="#718594" stroke-width="1"/>
<text x="469.00" y="448.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">40</text>
<line x1="565.00" y1="421.00" x2="565.00" y2="429.00" stroke="#718594" stroke-width="1"/>
<text x="565.00" y="448.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">50</text>
<line x1="81.00" y1="332.14" x2="89.00" y2="332.14" stroke="#718594" stroke-width="1"/>
<text x="75.00" y="337.14" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">13</text>
<line x1="81.00" y1="282.14" x2="89.00" y2="282.14" stroke="#718594" stroke-width="1"/>
<text x="75.00" y="287.14" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">20</text>
<line x1="81.00" y1="246.43" x2="89.00" y2="246.43" stroke="#718594" stroke-width="1"/>
<text x="75.00" y="251.43" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">25</text>
<line x1="81.00" y1="139.29" x2="89.00" y2="139.29" stroke="#718594" stroke-width="1"/>
<text x="75.00" y="144.29" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">40</text>
<text x="577.00" y="431.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400"></text>
<text x="95.00" y="133.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400"></text>
<polyline clip-path="url(#plot1)" points="85.00,425.00 181.00,389.29 277.00,332.14 373.00,246.43 469.00,175.00 565.00,139.29" fill="none" stroke="#155e82" stroke-width="2.7"/>
<line x1="85.00" y1="282.14" x2="333.00" y2="282.14" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<line x1="333.00" y1="425.00" x2="333.00" y2="282.14" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<circle cx="333.00" cy="282.14" r="4.8" fill="#a33434" stroke="#a33434" stroke-width="2"/>
<text x="348.00" y="307.14" font-family="Arial,sans-serif" font-size="19" fill="#a33434" text-anchor="start" font-weight="400">M</text>
<text x="85.00" y="90.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Cumulative number of observations</text>
<text x="325.00" y="485.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">Class boundary/value</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">N=40,so half-count = 20.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Before class20–30,count is13.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">That class contains12 observations.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Need7/12 of its width10.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Median estimate = 155/6 ≈ 25.83.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Straight segments assume</text>
<text x="635.00" y="370.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">uniform progress within each class.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Grouped interpolation estimates the median; class counts do not identify exact raw middle values.</text>
</svg>