<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q8: average ordinary distances from the mean</title><desc id="desc">Each original observation is joined horizontally to the specified centre; segment length is the absolute deviation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q8: average ordinary distances from the mean</text>
<line x1="360.00" y1="110.00" x2="360.00" y2="435.00" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="360.00" y="90.00" font-family="Arial,sans-serif" font-size="18" fill="#a33434" text-anchor="middle" font-weight="400">Centre 6</text>
<text x="65.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Value</text>
<text x="610.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="end" font-weight="400">Distance</text>
<text x="65.00" y="151.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">2</text>
<line x1="202.31" y1="145.00" x2="360.00" y2="145.00" stroke="#155e82" stroke-width="3"/>
<circle cx="202.31" cy="145.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="610.00" y="151.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="end" font-weight="400">4</text>
<text x="65.00" y="216.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">4</text>
<line x1="281.15" y1="210.00" x2="360.00" y2="210.00" stroke="#155e82" stroke-width="3"/>
<circle cx="281.15" cy="210.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="610.00" y="216.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="end" font-weight="400">2</text>
<text x="65.00" y="281.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">6</text>
<line x1="360.00" y1="275.00" x2="360.00" y2="275.00" stroke="#155e82" stroke-width="3"/>
<circle cx="360.00" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="610.00" y="281.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="end" font-weight="400">0</text>
<text x="65.00" y="346.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">8</text>
<line x1="438.85" y1="340.00" x2="360.00" y2="340.00" stroke="#155e82" stroke-width="3"/>
<circle cx="438.85" cy="340.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="610.00" y="346.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="end" font-weight="400">2</text>
<text x="65.00" y="411.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">10</text>
<line x1="517.69" y1="405.00" x2="360.00" y2="405.00" stroke="#155e82" stroke-width="3"/>
<circle cx="517.69" cy="405.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="610.00" y="411.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="end" font-weight="400">4</text>
<text x="660.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The mean is 6.</text>
<text x="660.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Distances: 4,2,0,2,4.</text>
<text x="660.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The zero distance still counts</text>
<text x="660.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">as one of five observations.</text>
<text x="660.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">MD = 12/5 = 2.4.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">All horizontal segments share the same value scale; their lengths are ordinary absolute distances.</text>
</svg>