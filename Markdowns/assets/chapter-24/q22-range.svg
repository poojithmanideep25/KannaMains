<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q22: range and coefficient of range are different quantities</title><desc id="desc">Actual source extrema on a value-scaled number line; ratio and difference use the same endpoints.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q22: range and coefficient of range are different quantities</text>
<defs><clipPath id="plot1"><rect x="85" y="180" width="480" height="180"/></clipPath></defs>
<line x1="85.00" y1="360.00" x2="85.00" y2="180.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="270.00" x2="565.00" y2="270.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="133.00" y1="266.00" x2="133.00" y2="274.00" stroke="#718594" stroke-width="1"/>
<text x="133.00" y="293.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">10</text>
<line x1="517.00" y1="266.00" x2="517.00" y2="274.00" stroke="#718594" stroke-width="1"/>
<text x="517.00" y="293.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">90</text>
<text x="577.00" y="276.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400"></text>
<text x="95.00" y="188.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400"></text>
<line x1="133.00" y1="247.50" x2="517.00" y2="247.50" stroke="#155e82" stroke-width="4"/>
<circle cx="133.00" cy="247.50" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="118.00" y="227.50" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">S</text>
<circle cx="517.00" cy="247.50" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="522.00" y="227.50" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">L</text>
<text x="325.00" y="410.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">Observation value</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Smallest S=10; largest L=90.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Range L−S = 80 (original units).</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Sum L+S = 100.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Coefficient = 80/100 = 0.8.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The coefficient is dimensionless.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The drawn segment length represents the actual range80; the coefficient is the separate ratio.</text>
</svg>