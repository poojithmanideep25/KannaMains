<text x="191.67" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<line x1="229.76" y1="361.00" x2="229.76" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="229.76" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">3</text>
<line x1="267.86" y1="361.00" x2="267.86" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="267.86" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">4</text>
<line x1="305.95" y1="361.00" x2="305.95" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="305.95" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">5</text>
<line x1="344.05" y1="361.00" x2="344.05" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="344.05" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">6</text>
<line x1="382.14" y1="361.00" x2="382.14" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="382.14" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">7</text>
<line x1="420.24" y1="361.00" x2="420.24" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="420.24" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">8</text>
<line x1="458.33" y1="361.00" x2="458.33" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="458.33" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">9</text>
<line x1="496.43" y1="361.00" x2="496.43" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="496.43" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">10</text>
<line x1="325.00" y1="250.00" x2="325.00" y2="370.00" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="325.00" y="240.00" font-family="Arial,sans-serif" font-size="17" fill="#a33434" text-anchor="middle" font-weight="400">mean 11/2</text>
<circle cx="153.57" cy="347.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
