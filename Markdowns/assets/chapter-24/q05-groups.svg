<text x="337.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Mean</text>
<rect x="435" y="110" width="130" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="447.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Sum</text>
<rect x="65" y="158" width="150" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">A</text>
<rect x="215" y="158" width="110" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="227.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">20</text>
<rect x="325" y="158" width="110" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="337.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">15</text>
<rect x="435" y="158" width="130" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="447.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">300</text>
<rect x="65" y="206" width="150" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">B</text>
<rect x="215" y="206" width="110" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="227.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">30</text>
<rect x="325" y="206" width="110" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="337.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">10</text>
<rect x="435" y="206" width="130" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="447.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">300</text>
<rect x="65" y="254" width="150" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Combined</text>
<rect x="215" y="254" width="110" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="227.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">50</text>
<rect x="325" y="254" width="110" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="337.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">12</text>
<rect x="435" y="254" width="130" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="447.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">600</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Each group contributes 300 to the sum.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">But group B has more observations.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The mean is 600/50 = 12.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The plain average 12.5 is not weighted.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Read each row with its header; the listed values are the quantities used in the solution.</text>
