<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q4: one compatible illustration of three x plus two</title><desc id="desc">Actual horizontal data coordinates; vertical stacking only records repeated observations. Compatible illustrative data are labelled explicitly.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q4: one compatible illustration of three x plus two</text>
<line x1="85.00" y1="220.00" x2="565.00" y2="220.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="85.00" y="70.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Compatible original data</text>
<line x1="153.57" y1="216.00" x2="153.57" y2="224.00" stroke="#718594" stroke-width="1"/>
<text x="153.57" y="246.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">4</text>
<line x1="215.91" y1="216.00" x2="215.91" y2="224.00" stroke="#718594" stroke-width="1"/>
<text x="215.91" y="246.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">8</text>
<line x1="309.42" y1="216.00" x2="309.42" y2="224.00" stroke="#718594" stroke-width="1"/>
<text x="309.42" y="246.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">14</text>
<line x1="496.43" y1="216.00" x2="496.43" y2="224.00" stroke="#718594" stroke-width="1"/>
<text x="496.43" y="246.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">26</text>
<line x1="184.74" y1="105.00" x2="184.74" y2="225.00" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="184.74" y="95.00" font-family="Arial,sans-serif" font-size="17" fill="#a33434" text-anchor="middle" font-weight="400">mean 6</text>
<circle cx="153.57" cy="202.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="215.91" cy="202.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<line x1="85.00" y1="420.00" x2="565.00" y2="420.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="85.00" y="270.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Transformed by y=3x+2</text>
<line x1="153.57" y1="416.00" x2="153.57" y2="424.00" stroke="#718594" stroke-width="1"/>
<text x="153.57" y="446.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">4</text>
<line x1="215.91" y1="416.00" x2="215.91" y2="424.00" stroke="#718594" stroke-width="1"/>
<text x="215.91" y="446.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">8</text>
<line x1="309.42" y1="416.00" x2="309.42" y2="424.00" stroke="#718594" stroke-width="1"/>
<text x="309.42" y="446.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">14</text>
<line x1="496.43" y1="416.00" x2="496.43" y2="424.00" stroke="#718594" stroke-width="1"/>
<text x="496.43" y="446.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">26</text>
<line x1="402.92" y1="305.00" x2="402.92" y2="425.00" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="402.92" y="295.00" font-family="Arial,sans-serif" font-size="17" fill="#a33434" text-anchor="middle" font-weight="400">mean 20</text>
<circle cx="309.42" cy="402.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="496.43" cy="402.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Original mean 6,variance 4.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">New mean 20,variance 36.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Distances from the centre triple.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The illustrated data are not unique.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The rule holds for any source data.</text>
<text x="325.00" y="490.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">Horizontal position = observation value</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">One dot is one observation. Vertical stacking shows repetitions,not a second measured quantity.</text>
</svg>