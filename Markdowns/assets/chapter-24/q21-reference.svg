<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q21: a reference value need not be the actual mean</title><desc id="desc">Actual horizontal data coordinates; vertical stacking only records repeated observations. Compatible illustrative data are labelled explicitly.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q21: a reference value need not be the actual mean</text>
<line x1="85.00" y1="365.00" x2="565.00" y2="365.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="85.00" y="215.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">One compatible ten-observation illustration</text>
<line x1="153.57" y1="361.00" x2="153.57" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="153.57" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">4</text>
<line x1="496.43" y1="361.00" x2="496.43" y2="369.00" stroke="#718594" stroke-width="1"/>
<text x="496.43" y="391.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">8</text>
<line x1="325.00" y1="250.00" x2="325.00" y2="370.00" stroke="#a33434" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="325.00" y="240.00" font-family="Arial,sans-serif" font-size="17" fill="#a33434" text-anchor="middle" font-weight="400">mean 6</text>
<line x1="239.29" y1="270.00" x2="239.29" y2="370.00" stroke="#a04c13" stroke-width="1.5" stroke-dasharray="7 5"/>
<circle cx="153.57" cy="347.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="153.57" cy="329.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="153.57" cy="311.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="153.57" cy="293.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="153.57" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="496.43" cy="347.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="496.43" cy="329.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="496.43" cy="311.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="496.43" cy="293.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<circle cx="496.43" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Five4s and five8s fit the source totals.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Red: mean6; orange: reference5.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Sum of deviations from5 is10.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Sum of squared deviations from5 is50.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Variance = 50/10−1² = 4.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">This illustration is not unique.</text>
<text x="325.00" y="490.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">Horizontal position = observation value</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">One dot is one observation. Vertical stacking shows repetitions,not a second measured quantity.</text>
</svg>