<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q10: the ladder length stays 5 m</title><desc id="desc">Actual 3–4–5 right triangle, equal length units, with signed coordinate rates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q10: the ladder length stays 5 m</text>
<line x1="165.00" y1="95.00" x2="165.00" y2="410.00" stroke="#718594" stroke-width="4"/>
<line x1="165.00" y1="410.00" x2="470.00" y2="410.00" stroke="#718594" stroke-width="4"/>
<line x1="165.00" y1="130.00" x2="375.00" y2="410.00" stroke="#155e82" stroke-width="5"/>
<line x1="165.00" y1="390.00" x2="185.00" y2="390.00" stroke="#20394d" stroke-width="2.3"/>
<line x1="185.00" y1="390.00" x2="185.00" y2="410.00" stroke="#20394d" stroke-width="2.3"/>
<text x="255.00" y="443.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">x = 3 m</text>
<text x="75.00" y="280.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">y = 4 m</text>
<text x="290.00" y="265.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="start" font-weight="400">5 m</text>
<line x1="385.00" y1="385.00" x2="455.00" y2="385.00" stroke="#a04c13" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380.00" y="355.00" font-family="Arial,sans-serif" font-size="18" fill="#a04c13" text-anchor="start" font-weight="400">dx/dt = 2 m/s</text>
<line x1="130.00" y1="160.00" x2="130.00" y2="235.00" stroke="#a33434" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="535.00" y="145.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">x² + y² = 25</text>
<text x="535.00" y="205.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">2x dx/dt + 2y dy/dt = 0</text>
<text x="535.00" y="265.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">dy/dt = −1.5 m/s</text>
<text x="535.00" y="325.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">Downward speed = 1.5 m/s</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal length units. The top moves down while the foot moves right.</text>
</svg>