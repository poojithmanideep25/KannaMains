<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q9 and Q26: a changing radius changes the volume</title><desc id="desc">Explanatory sphere drawing, labelled with the current radius five; schematic 3D projection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q9 and Q26: a changing radius changes the volume</text>
<circle cx="280.00" cy="245.00" r="125" fill="#edf3f7" stroke="#155e82" stroke-width="2.5"/>
<ellipse cx="280" cy="245" rx="125" ry="35" fill="none" stroke="#718594" stroke-dasharray="6 5"/>
<circle cx="280.00" cy="245.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="252.00" y="269.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">O</text>
<line x1="280.00" y1="245.00" x2="405.00" y2="245.00" stroke="#155e82" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="325.00" y="224.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">r = 5 cm</text>
<text x="505.00" y="135.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Volume: V = 4πr³/3</text>
<text x="505.00" y="193.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Input: dV/dt = 10 cm³/s</text>
<text x="505.00" y="251.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Find: dr/dt in cm/s</text>
<text x="505.00" y="309.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">dV/dt = 4πr² dr/dt</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">A sphere is shown schematically; the rate equation uses its actual volume formula.</text>
</svg>