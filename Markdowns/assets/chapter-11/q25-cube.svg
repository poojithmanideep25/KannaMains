<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q25: six square faces make the surface area</title><desc id="desc">Schematic cube with one edge labelled ten centimetres.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q25: six square faces make the surface area</text>
<line x1="160.00" y1="160.00" x2="340.00" y2="160.00" stroke="#155e82" stroke-width="3"/>
<line x1="340.00" y1="160.00" x2="340.00" y2="340.00" stroke="#155e82" stroke-width="3"/>
<line x1="340.00" y1="340.00" x2="160.00" y2="340.00" stroke="#155e82" stroke-width="3"/>
<line x1="160.00" y1="340.00" x2="160.00" y2="160.00" stroke="#155e82" stroke-width="3"/>
<line x1="160.00" y1="160.00" x2="245.00" y2="95.00" stroke="#155e82" stroke-width="3"/>
<line x1="245.00" y1="95.00" x2="425.00" y2="95.00" stroke="#155e82" stroke-width="3"/>
<line x1="425.00" y1="95.00" x2="340.00" y2="160.00" stroke="#155e82" stroke-width="3"/>
<line x1="425.00" y1="95.00" x2="425.00" y2="275.00" stroke="#155e82" stroke-width="3"/>
<line x1="425.00" y1="275.00" x2="340.00" y2="340.00" stroke="#155e82" stroke-width="3"/>
<text x="190.00" y="380.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">a = 10 cm</text>
<text x="80.00" y="425.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">da/dt = 0.1 cm/s</text>
<text x="510.00" y="145.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Surface area: S = 6a²</text>
<text x="510.00" y="210.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">dS/dt = 12a da/dt</text>
<text x="510.00" y="275.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">At a = 10: 12 cm²/s</text>
<text x="510.00" y="340.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Volume a³ is a different target.</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The cube is an oblique schematic. All six faces contribute to surface area.</text>
</svg>