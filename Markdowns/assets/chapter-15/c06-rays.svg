<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">A ratio stays the same along a ray</title><desc id="desc">Points (1,1) and (2,2) both have y/x=1; the homogeneous slope (x²+y²)/(xy) equals 2 at both. The ray is not itself claimed as a solution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">A ratio stays the same along a ray</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="330.0" height="330.0"/></clipPath></defs>
<line x1="105.62" y1="430.00" x2="105.62" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="409.38" x2="415.00" y2="409.38" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="208.75" y1="405.38" x2="208.75" y2="413.38" stroke="#718594" stroke-width="1"/>
<text x="208.75" y="432.38" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">1</text>
<line x1="311.88" y1="405.38" x2="311.88" y2="413.38" stroke="#718594" stroke-width="1"/>
<text x="311.88" y="432.38" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<text x="427.00" y="415.38" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="115.62" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<line x1="105.62" y1="409.38" x2="384.06" y2="130.94" stroke="#718594" stroke-width="1.7" stroke-dasharray="7 5"/>
<circle cx="208.75" cy="306.25" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="148.75" y="293.25" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">(1,1)</text>
<line x1="193.28" y1="337.19" x2="224.22" y2="275.31" stroke="#155e82" stroke-width="3"/>
<circle cx="311.88" cy="203.12" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="251.88" y="190.12" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">(2,2)</text>
<line x1="296.41" y1="234.06" x2="327.34" y2="172.19" stroke="#155e82" stroke-width="3"/>
<text x="640.00" y="110.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Same ray: y/x = 1.</text>
<text x="640.00" y="158.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">For f = x/y + y/x,</text>
<text x="640.00" y="206.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">the slope is 1 + 1 = 2.</text>
<text x="640.00" y="254.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Blue marks show slope 2.</text>
<text x="640.00" y="302.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">The gray ray has slope 1.</text>
<text x="640.00" y="350.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">It is not a solution curve.</text>
<text x="500.00" y="522.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units on both axes.</text>
</svg>