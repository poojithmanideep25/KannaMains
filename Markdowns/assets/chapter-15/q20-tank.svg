<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">Q20: write the salt rate, not just the water rate</title><desc id="desc">Pure water enters a well-mixed50L tank at2L/min; solution leaves at2L/min. The salt concentration S/50 decreases with time.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q20: write the salt rate, not just the water rate</text>
<rect x="120" y="150" width="330" height="230" rx="22" fill="#edf3f7" stroke="#155e82" stroke-width="1.5"/>
<line x1="25.00" y1="195.00" x2="115.00" y2="195.00" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="450.00" y1="315.00" x2="555.00" y2="315.00" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<text x="35.00" y="130.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Pure water in</text>
<text x="35.00" y="155.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">2 L/min; no salt</text>
<text x="150.00" y="235.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">Volume = 50 L</text>
<text x="150.00" y="280.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">Salt amount = S(t) kg</text>
<text x="150.00" y="325.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Concentration = S/50</text>
<text x="470.00" y="355.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Solution out: 2 L/min</text>
<text x="640.00" y="140.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Salt in = 0 kg/min</text>
<text x="640.00" y="188.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Salt out = 2 × S/50</text>
<text x="640.00" y="236.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">S′ = −S/25</text>
<text x="640.00" y="284.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">S(0) = 25 kg</text>
<text x="640.00" y="332.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">S(25) = 25/e kg</text>
<text x="500.00" y="492.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal water rates keep volume fixed; they do not keep concentration fixed.</text>
</svg>