<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Q34: an implicit curve may stop being a y-of-x graph</title><desc id="desc">For C1, x=e^y−y−1. Away from y0 it gives regular inverse branches. At(0,0), x+y=0 and the original equation is undefined.</desc>
