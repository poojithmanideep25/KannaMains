<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Q12: a diamond is four right triangles</title><desc id="desc">Exact vertices with equal coordinate units.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q12: a diamond is four right triangles</text>
<polygon points="330.00,280.00 230.00,130.00 130.00,280.00 230.00,430.00" fill="#dcecf4" stroke="#155e82" stroke-width="2.5"/>
<defs><clipPath id="plot1"><rect x="110" y="100" width="240" height="360"/></clipPath></defs>
<line x1="230.00" y1="460.00" x2="230.00" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="110.00" y1="280.00" x2="350.00" y2="280.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130.00" y1="276.00" x2="130.00" y2="284.00" stroke="#718594" stroke-width="1"/>
<text x="130.00" y="303.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">−2</text>
<line x1="330.00" y1="276.00" x2="330.00" y2="284.00" stroke="#718594" stroke-width="1"/>
<text x="330.00" y="303.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<text x="362.00" y="286.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="240.00" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<line x1="130.00" y1="280.00" x2="330.00" y2="280.00" stroke="#718594" stroke-width="1.7" stroke-dasharray="7 5"/>
<line x1="230.00" y1="430.00" x2="230.00" y2="130.00" stroke="#718594" stroke-width="1.7" stroke-dasharray="7 5"/>
<circle cx="230.00" cy="130.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="145.00" y="115.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">(0,3)</text>
<circle cx="230.00" cy="430.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="245.00" y="455.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">(0,−3)</text>
<text x="520.00" y="140.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Intercepts: ±2 horizontally</text>
<text x="520.00" y="205.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">and ±3 vertically</text>
<text x="520.00" y="270.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Full diagonals: 4 and 6</text>
<text x="520.00" y="335.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Area = (1/2) × 4 × 6</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units. Each quarter is a triangle with perpendicular legs 2 and 3.</text>
</svg>