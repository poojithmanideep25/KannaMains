<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">Three-digit multiples: check both boundaries</title><desc id="desc">Independent same-unit zooms of lower98,100,105and upper994,999,1001.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Three-digit multiples: check both boundaries</text>
<text x="268.00" y="105.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">Lower boundary</text>
<line x1="100.00" y1="210.00" x2="436.00" y2="210.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="212.00" y1="150.00" x2="212.00" y2="290.00" stroke="#a04c13" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="212.00" y="325.00" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="middle" font-weight="400">100 boundary</text>
<circle cx="156.00" cy="210.00" r="4.8" fill="white" stroke="#718594" stroke-width="2"/>
<text x="156.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">98</text>
<circle cx="352.00" cy="210.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="352.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">105</text>
<text x="268.00" y="395.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="400">105 is the first allowed</text>
<text x="768.00" y="105.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">Upper boundary</text>
<line x1="600.00" y1="210.00" x2="936.00" y2="210.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="796.00" y1="150.00" x2="796.00" y2="290.00" stroke="#a04c13" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="796.00" y="325.00" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="middle" font-weight="400">999 boundary</text>
<circle cx="656.00" cy="210.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="656.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">994</text>
<circle cx="852.00" cy="210.00" r="4.8" fill="white" stroke="#718594" stroke-width="2"/>
<text x="852.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">1001</text>
<text x="768.00" y="395.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="400">994 is the last allowed</text>
<text x="500.00" y="472.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Separate boundary zooms; both use the same scale. Values outside 100…999 are excluded.</text>
</svg>