<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Count position gaps before multiplying by d</title><desc id="desc">Term positions five to nine have four gaps; nine to fifteen have six. Values are 17,33,57.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Count position gaps before multiplying by d</text>
<line x1="120.00" y1="215.00" x2="860.00" y2="215.00" stroke="#718594" stroke-width="2.3"/>
<line x1="120.00" y1="208.00" x2="120.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="120.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">5</text>
<line x1="194.00" y1="208.00" x2="194.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="194.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">6</text>
<line x1="268.00" y1="208.00" x2="268.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="268.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">7</text>
<line x1="342.00" y1="208.00" x2="342.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="342.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">8</text>
<line x1="416.00" y1="208.00" x2="416.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="416.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">9</text>
<line x1="490.00" y1="208.00" x2="490.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="490.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">10</text>
<line x1="564.00" y1="208.00" x2="564.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="564.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">11</text>
<line x1="638.00" y1="208.00" x2="638.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="638.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">12</text>
<line x1="712.00" y1="208.00" x2="712.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="712.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">13</text>
<line x1="786.00" y1="208.00" x2="786.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="786.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">14</text>
<line x1="860.00" y1="208.00" x2="860.00" y2="222.00" stroke="#718594" stroke-width="1"/>
<text x="860.00" y="250.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">15</text>
<circle cx="120.00" cy="215.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="120.00" y="170.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="700">T5 = 17</text>
<circle cx="416.00" cy="215.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="416.00" y="170.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="700">T9 = 33</text>
<circle cx="860.00" cy="215.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="860.00" y="170.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="700">T15 = 57</text>
<line x1="120.00" y1="105.00" x2="416.00" y2="105.00" stroke="#155e82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="268.00" y="82.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">4 gaps × 4 = 16</text>
<line x1="416.00" y1="105.00" x2="860.00" y2="105.00" stroke="#155e82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="638.00" y="82.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">6 gaps × 4 = 24</text>
<text x="500.00" y="325.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">The horizontal scale is the term position, not the term value.</text>
<text x="500.00" y="402.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">T₉ − T₅ = 16; each one-position move adds d = 4.</text>
</svg>