<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Four inserted arithmetic means: five gaps</title><desc id="desc">To-scale number line from3to28 marked at3,8,13,18,23,28.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Four inserted arithmetic means: five gaps</text>
<line x1="130.00" y1="205.00" x2="875.00" y2="205.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="150.00" cy="205.00" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="150.00" y="250.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">3</text>
<text x="220.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">+5</text>
<circle cx="290.00" cy="205.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="290.00" y="250.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">8</text>
<text x="360.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">+5</text>
<circle cx="430.00" cy="205.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="430.00" y="250.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">13</text>
<text x="500.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">+5</text>
<circle cx="570.00" cy="205.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="570.00" y="250.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">18</text>
<text x="640.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">+5</text>
<circle cx="710.00" cy="205.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="710.00" y="250.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">23</text>
<text x="780.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">+5</text>
<circle cx="850.00" cy="205.00" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="850.00" y="250.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">28</text>
<text x="500.00" y="105.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Six terms = two endpoints + four inserted means</text>
<text x="500.00" y="330.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="400">Inserted sum = (8+23) + (13+18) = 62</text>
<text x="500.00" y="402.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal distances represent equal numerical differences. There are five gaps.</text>
</svg>