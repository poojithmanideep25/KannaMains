<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Square each term: square the ratio too</title><desc id="desc">The first four terms4,2,1,1/2 give squared terms16,4,1,1/4.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Square each term: square the ratio too</text>
<text x="50.00" y="155.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="700">Original terms</text>
<rect x="280" y="115" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="320.00" y="157.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">4</text>
<text x="402.00" y="156.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">× 1/2</text>
<rect x="445" y="115" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="485.00" y="157.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">2</text>
<text x="567.00" y="156.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">× 1/2</text>
<rect x="610" y="115" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="650.00" y="157.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">1</text>
<text x="732.00" y="156.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">× 1/2</text>
<rect x="775" y="115" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="815.00" y="157.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">1/2</text>
<text x="50.00" y="290.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="700">Squared terms</text>
<rect x="280" y="250" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="320.00" y="292.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">16</text>
<text x="402.00" y="291.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">× 1/4</text>
<rect x="445" y="250" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="485.00" y="292.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">4</text>
<text x="567.00" y="291.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">× 1/4</text>
<rect x="610" y="250" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="650.00" y="292.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">1</text>
<text x="732.00" y="291.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">× 1/4</text>
<rect x="775" y="250" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="815.00" y="292.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">1/4</text>
<text x="500.00" y="395.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">New GP: first term 4² = 16; ratio (1/2)² = 1/4.</text>
<text x="500.00" y="442.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">These are term slots, not a number line. The infinite sums are 8 and 64/3.</text>
</svg>