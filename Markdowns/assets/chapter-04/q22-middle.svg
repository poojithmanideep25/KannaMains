<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">The allowed GP order is nine, three, one</title><desc id="desc">Bar heights9,3,1 at integer positions; ratio1/3 makes the infinite GP converge.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">The allowed GP order is nine, three, one</text>
<defs><clipPath id="plot1"><rect x="120" y="120" width="380" height="330"/></clipPath></defs>
<line x1="120.00" y1="450.00" x2="120.00" y2="120.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120.00" y1="450.00" x2="500.00" y2="450.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.00" y1="446.00" x2="220.00" y2="454.00" stroke="#718594" stroke-width="1"/>
<text x="220.00" y="473.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">1</text>
<line x1="320.00" y1="446.00" x2="320.00" y2="454.00" stroke="#718594" stroke-width="1"/>
<text x="320.00" y="473.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<line x1="420.00" y1="446.00" x2="420.00" y2="454.00" stroke="#718594" stroke-width="1"/>
<text x="420.00" y="473.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">3</text>
<line x1="116.00" y1="418.57" x2="124.00" y2="418.57" stroke="#718594" stroke-width="1"/>
<text x="110.00" y="423.57" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">1</text>
<line x1="116.00" y1="355.71" x2="124.00" y2="355.71" stroke="#718594" stroke-width="1"/>
<text x="110.00" y="360.71" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">3</text>
<line x1="116.00" y1="167.14" x2="124.00" y2="167.14" stroke="#718594" stroke-width="1"/>
<text x="110.00" y="172.14" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">9</text>
<text x="512.00" y="456.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">n</text>
<text x="130.00" y="128.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">T<tspan baseline-shift="sub" font-size="75%">n</tspan></text>
<rect x="195.0" y="167.14285714285714" width="50" height="282.8571428571429" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<circle cx="220.00" cy="167.14" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<rect x="295.0" y="355.7142857142857" width="50" height="94.28571428571428" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<circle cx="320.00" cy="355.71" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<rect x="395.0" y="418.57142857142856" width="50" height="31.428571428571445" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<circle cx="420.00" cy="418.57" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="600.00" y="160.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Sum: 9 + 3 + 1 = 13</text>
<text x="600.00" y="230.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="400">Squares: 81 + 9 + 1 = 91</text>
<text x="600.00" y="300.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="start" font-weight="400">Middle term: y = 39/13 = 3</text>
<text x="600.00" y="370.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="start" font-weight="400">Ratio: 1/3, so |r| &lt; 1</text>
<text x="500.00" y="542.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Reverse order has ratio 3 and fails the convergence condition, despite matching both finite sums.</text>
</svg>