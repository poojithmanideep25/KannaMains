<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Pair an AP forward and backward</title><desc id="desc">Six-term explanatory AP 3,7,11,15,19,23 is reversed underneath; every column totals26.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Pair an AP forward and backward</text>
<text x="45.00" y="120.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">Forward</text>
<text x="240.00" y="120.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">3</text>
<text x="365.00" y="120.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">7</text>
<text x="490.00" y="120.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">11</text>
<text x="615.00" y="120.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">15</text>
<text x="740.00" y="120.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">19</text>
<text x="865.00" y="120.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">23</text>
<text x="45.00" y="200.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">Backward</text>
<text x="240.00" y="200.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">23</text>
<text x="365.00" y="200.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">19</text>
<text x="490.00" y="200.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">15</text>
<text x="615.00" y="200.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">11</text>
<text x="740.00" y="200.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">7</text>
<text x="865.00" y="200.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">3</text>
<text x="45.00" y="290.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="700">Column sum</text>
<text x="240.00" y="290.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">26</text>
<text x="365.00" y="290.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">26</text>
<text x="490.00" y="290.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">26</text>
<text x="615.00" y="290.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">26</text>
<text x="740.00" y="290.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">26</text>
<text x="865.00" y="290.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">26</text>
<line x1="200.00" y1="235.00" x2="925.00" y2="235.00" stroke="#718594" stroke-width="1.5"/>
<text x="500.00" y="355.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Two copies of the sum = 6 × 26; one copy = 78.</text>
<text x="500.00" y="412.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">This short example shows why S<tspan baseline-shift="sub" font-size="75%">n</tspan> = n(first + last)/2.</text>
</svg>