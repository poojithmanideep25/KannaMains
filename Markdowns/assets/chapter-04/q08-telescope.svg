<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Overlapping pairs cancel between rows</title><desc id="desc">Finite first-three-term example of twice the triple-denominator sum; neighbouring pair fractions cancel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Overlapping pairs cancel between rows</text>
<text x="90.00" y="135.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">k = 1</text>
<text x="350.00" y="135.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="400">1/(1·2)</text>
<text x="730.00" y="135.00" font-family="Arial,sans-serif" font-size="25" fill="#718594" text-anchor="middle" font-weight="400">− 1/(2·3)</text>
<line x1="650.00" y1="150.00" x2="430.00" y2="225.00" stroke="#718594" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="90.00" y="240.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">k = 2</text>
<text x="350.00" y="240.00" font-family="Arial,sans-serif" font-size="25" fill="#718594" text-anchor="middle" font-weight="400">1/(2·3)</text>
<text x="730.00" y="240.00" font-family="Arial,sans-serif" font-size="25" fill="#718594" text-anchor="middle" font-weight="400">− 1/(3·4)</text>
<line x1="650.00" y1="255.00" x2="430.00" y2="330.00" stroke="#718594" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="90.00" y="345.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">k = 3</text>
<text x="350.00" y="345.00" font-family="Arial,sans-serif" font-size="25" fill="#718594" text-anchor="middle" font-weight="400">1/(3·4)</text>
<text x="730.00" y="345.00" font-family="Arial,sans-serif" font-size="25" fill="#a04c13" text-anchor="middle" font-weight="400">− 1/(4·5)</text>
<text x="500.00" y="455.00" font-family="Arial,sans-serif" font-size="26" fill="#20394d" text-anchor="middle" font-weight="400">2S₃ = 1/(1·2) − 1/(4·5)</text>
<text x="500.00" y="505.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">For n terms: keep 1/(1·2) and −1/((n+1)(n+2)).</text>
<text x="500.00" y="552.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Dashed links connect equal fractions with opposite signs. The whole display is 2S, not S.</text>
</svg>