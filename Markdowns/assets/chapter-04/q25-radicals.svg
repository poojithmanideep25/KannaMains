<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Rationalization creates a chain of differences</title><desc id="desc">Four displayed summand groups show square-root cancellation with firstsurvivor minusone and lastsurvivor plusseven.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Rationalization creates a chain of differences</text>
<text x="130.00" y="115.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">k = 1</text>
<text x="420.00" y="115.00" font-family="Arial,sans-serif" font-size="27" fill="#20394d" text-anchor="middle" font-weight="400">√2</text>
<text x="730.00" y="115.00" font-family="Arial,sans-serif" font-size="27" fill="#a04c13" text-anchor="middle" font-weight="400">− √1</text>
<text x="130.00" y="200.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">k = 2</text>
<text x="420.00" y="200.00" font-family="Arial,sans-serif" font-size="27" fill="#20394d" text-anchor="middle" font-weight="400">√3</text>
<text x="730.00" y="200.00" font-family="Arial,sans-serif" font-size="27" fill="#20394d" text-anchor="middle" font-weight="400">− √2</text>
<text x="130.00" y="285.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">⋮</text>
<text x="420.00" y="285.00" font-family="Arial,sans-serif" font-size="27" fill="#20394d" text-anchor="middle" font-weight="400">⋮</text>
<text x="730.00" y="285.00" font-family="Arial,sans-serif" font-size="27" fill="#20394d" text-anchor="middle" font-weight="400">⋮</text>
<text x="130.00" y="370.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="start" font-weight="400">k = 48</text>
<text x="420.00" y="370.00" font-family="Arial,sans-serif" font-size="27" fill="#155e82" text-anchor="middle" font-weight="400">√49</text>
<text x="730.00" y="370.00" font-family="Arial,sans-serif" font-size="27" fill="#20394d" text-anchor="middle" font-weight="400">− √48</text>
<line x1="450.00" y1="125.00" x2="680.00" y2="183.00" stroke="#718594" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="500.00" y="465.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Only the boundaries survive: √49 − √1 = 7 − 1 = 6</text>
<text x="500.00" y="502.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The omitted middle rows cancel in the same way; the displayed ellipsis is not an extra summand.</text>
</svg>