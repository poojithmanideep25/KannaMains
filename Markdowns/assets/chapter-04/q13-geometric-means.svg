<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Five positive geometric means: six ratio steps</title><desc id="desc">Seven indexed terms2,4,8,16,32,64,128 multiply by2; inner symmetric products are256.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Five positive geometric means: six ratio steps</text>
<rect x="70" y="125" width="80" height="65" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="110.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#718594" text-anchor="middle" font-weight="700">2</text>
<text x="175.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">×2</text>
<rect x="200" y="125" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="240.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="700">4</text>
<text x="305.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">×2</text>
<rect x="330" y="125" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="370.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="700">8</text>
<text x="435.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">×2</text>
<rect x="460" y="125" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="500.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="700">16</text>
<text x="565.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">×2</text>
<rect x="590" y="125" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="630.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="700">32</text>
<text x="695.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">×2</text>
<rect x="720" y="125" width="80" height="65" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="760.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="700">64</text>
<text x="825.00" y="100.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">×2</text>
<rect x="850" y="125" width="80" height="65" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="890.00" y="166.00" font-family="Arial,sans-serif" font-size="23" fill="#718594" text-anchor="middle" font-weight="700">128</text>
<line x1="240.00" y1="240.00" x2="760.00" y2="240.00" stroke="#a04c13" stroke-width="2"/>
<text x="500.00" y="278.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">4 × 64 = 256; 8 × 32 = 256; middle = 16</text>
<text x="500.00" y="355.00" font-family="Arial,sans-serif" font-size="27" fill="#155e82" text-anchor="middle" font-weight="400">Product = 256² × 16 = 2²⁰</text>
<text x="500.00" y="462.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">These are equally spaced term slots, not a number line. Positive means are the source convention.</text>
</svg>