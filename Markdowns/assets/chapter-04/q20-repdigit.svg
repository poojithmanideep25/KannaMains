<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Repeated fives are place-value sums</title><desc id="desc">Exact place-value table for5,55,555, with hundreds,tens,ones contributions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Repeated fives are place-value sums</text>
<text x="90.00" y="110.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">Number</text>
<text x="280.00" y="110.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">Hundreds</text>
<text x="470.00" y="110.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">Tens</text>
<text x="660.00" y="110.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">Ones</text>
<text x="850.00" y="110.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="700">Expansion</text>
<text x="90.00" y="185.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">5</text>
<text x="280.00" y="185.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<text x="470.00" y="185.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<text x="660.00" y="185.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">5</text>
<text x="850.00" y="185.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="400">5</text>
<text x="90.00" y="260.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">55</text>
<text x="280.00" y="260.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<text x="470.00" y="260.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">50</text>
<text x="660.00" y="260.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">5</text>
<text x="850.00" y="260.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="400">5(10+1)</text>
<text x="90.00" y="335.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">555</text>
<text x="280.00" y="335.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">500</text>
<text x="470.00" y="335.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">50</text>
<text x="660.00" y="335.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">5</text>
<text x="850.00" y="335.00" font-family="Arial,sans-serif" font-size="21" fill="#155e82" text-anchor="middle" font-weight="400">5(100+10+1)</text>
<text x="500.00" y="442.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Each added digit introduces a new power of 10; the powers form a GP.</text>
</svg>