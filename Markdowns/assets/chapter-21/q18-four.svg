<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">Q18: four different geometric quantities need four tests</title><desc id="desc">Actual source distances and directions shown as true lower-dimensional views; each panel declares its role.</desc>
