<text x="399.22" y="309.44" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P</text>
<text x="250.00" y="400.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="middle" font-weight="400">Original P = (2,3,6); OP = 7</text>
