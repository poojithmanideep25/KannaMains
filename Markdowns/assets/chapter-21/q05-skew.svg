<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q5: the shortest connector joins actual feet</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q5: the shortest connector joins actual feet</text>
<line x1="186.22" y1="430.00" x2="325.15" y2="152.16" stroke="#155e82" stroke-width="2.7"/>
<line x1="181.08" y1="120.00" x2="458.92" y2="397.84" stroke="#a04c13" stroke-width="2.7"/>
<line x1="255.68" y1="291.08" x2="320.00" y2="258.92" stroke="#a33434" stroke-width="3.5"/>
<circle cx="255.68" cy="291.08" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="220.68" y="276.08" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P</text>
<circle cx="320.00" cy="258.92" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="335.00" y="243.92" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">Q</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Blue: first original line</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Orange: second original line</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Red PQ: actual shortest connector</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P,Q were solved on the two lines.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Each connector dot product is 0.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A crossing here can be a flat shadow.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>