<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q16: the new line stands perpendicular to both directions</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q16: the new line stands perpendicular to both directions</text>
<polygon points="287.24,430.00 189.22,285.04 352.76,120.00 450.78,264.96" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="320.00" y1="275.00" x2="261.00" y2="237.38" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="320.00" y1="275.00" x2="240.63" y2="306.52" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="320.00" y1="275.00" x2="400.24" y2="326.16" stroke="#a33434" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="261.00" cy="237.38" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="273.00" y="222.38" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">u</text>
<circle cx="240.63" cy="306.52" r="4.8" fill="#a04c13" stroke="#a04c13" stroke-width="2"/>
<text x="210.63" y="331.52" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="start" font-weight="400">v</text>
<circle cx="400.24" cy="326.16" r="4.8" fill="#a33434" stroke="#a33434" stroke-width="2"/>
<text x="415.24" y="311.16" font-family="Arial,sans-serif" font-size="19" fill="#a33434" text-anchor="start" font-weight="400">n</text>
<circle cx="320.00" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="290.00" y="300.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P = (1,2,3)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">u = (1,2,3); v = (3,2,1)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">n = (1,−2,1), a line direction</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">n dot u = n dot v = 0</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Arrow lengths are chosen</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">only to show directions.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>