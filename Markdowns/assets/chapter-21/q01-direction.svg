<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q1: destination minus start gives the direction</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q1: destination minus start gives the direction</text>
<line x1="292.85" y1="338.89" x2="491.95" y2="405.15" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="292.85" y1="338.89" x2="148.05" y2="430.00" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="292.85" y1="338.89" x2="292.85" y2="120.00" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="281.54" y1="287.87" x2="403.71" y2="149.43" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="281.54" y1="287.87" x2="331.31" y2="304.43" stroke="#a04c13" stroke-width="2.7" stroke-dasharray="7 5"/>
<line x1="331.31" y1="304.43" x2="403.71" y2="258.88" stroke="#a04c13" stroke-width="2.7" stroke-dasharray="7 5"/>
<line x1="403.71" y1="258.88" x2="403.71" y2="149.43" stroke="#a04c13" stroke-width="2.7" stroke-dasharray="7 5"/>
<circle cx="491.95" cy="405.15" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="503.95" y="410.15" font-family="Arial,sans-serif" font-size="19" fill="#718594" text-anchor="start" font-weight="400">x</text>
<circle cx="148.05" cy="430.00" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="160.05" y="435.00" font-family="Arial,sans-serif" font-size="19" fill="#718594" text-anchor="start" font-weight="400">y</text>
<circle cx="292.85" cy="120.00" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="304.85" y="125.00" font-family="Arial,sans-serif" font-size="19" fill="#718594" text-anchor="start" font-weight="400">z</text>
<circle cx="281.54" cy="287.87" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="251.54" y="312.87" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">A</text>
<circle cx="403.71" cy="149.43" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="418.71" y="134.43" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">B</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A = (1,2,3)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">B = (3,−2,7)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">AB = (2,−4,4)</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Negative y means move backwards</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">along the y direction.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>