<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q29: the common line lies in both planes</text>
<polygon points="277.37,120.00 479.10,298.03 362.63,430.00 160.90,251.97" fill="#dcecf4" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<polygon points="246.09,155.44 447.82,333.47 393.91,394.56 192.18,216.53" fill="#f5e9dd" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="148.56" y1="123.70" x2="491.44" y2="426.30" stroke="#155e82" stroke-width="3"/>
<circle cx="320.00" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="290.00" y="300.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Both original planes contain P.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P = (1,0,0)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Blue line direction: (4,−1,−3)</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">It is perpendicular to both normals.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The correct source option is (d).</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
