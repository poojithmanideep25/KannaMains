<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">A cross product emerges perpendicular to the two-arrow plane</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">A cross product emerges perpendicular to the two-arrow plane</text>
<polygon points="291.85,360.29 401.13,396.66 348.15,430.00 238.87,393.63" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="291.85" y1="360.29" x2="401.13" y2="396.66" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="291.85" y1="360.29" x2="238.87" y2="393.63" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="291.85" y1="360.29" x2="291.85" y2="120.00" stroke="#a33434" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="401.13" cy="396.66" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="416.13" y="421.66" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">u</text>
<circle cx="238.87" cy="393.63" r="4.8" fill="#a04c13" stroke="#a04c13" stroke-width="2"/>
<text x="208.87" y="418.63" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="start" font-weight="400">v</text>
<circle cx="291.85" cy="120.00" r="4.8" fill="#a33434" stroke="#a33434" stroke-width="2"/>
<text x="306.85" y="105.00" font-family="Arial,sans-serif" font-size="19" fill="#a33434" text-anchor="start" font-weight="400">n</text>
<circle cx="291.85" cy="360.29" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="261.85" y="385.29" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">O</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Illustration: u = (3,0,0)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">v = (0,2,0)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">n = u × v = (0,0,6)</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The shaded parallelogram is</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">in the actual xy-plane.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">n is perpendicular to u and v.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>