<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q23: a vertical direction remains inside this plane</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q23: a vertical direction remains inside this plane</text>
<polygon points="398.21,418.70 241.79,430.00 241.79,131.30 398.21,120.00" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="398.21" y1="418.70" x2="398.21" y2="120.00" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="398.21" y1="418.70" x2="241.79" y2="430.00" stroke="#155e82" stroke-width="2.7"/>
<circle cx="398.21" cy="418.70" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="413.21" y="443.70" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">A</text>
<circle cx="241.79" cy="430.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="211.79" y="455.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">B</text>
<circle cx="398.21" cy="120.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="413.21" y="105.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">z direction</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A = (1,0,0); B = (0,1,0)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Plane: x+y = 1</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Arrow: direction of the z-axis</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Changing z stays on the plane.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>