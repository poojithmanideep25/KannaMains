<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q28: both line parameters reach the same point</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q28: both line parameters reach the same point</text>
<line x1="330.56" y1="412.05" x2="309.44" y2="137.95" stroke="#155e82" stroke-width="2.7"/>
<line x1="314.72" y1="430.00" x2="325.28" y2="120.00" stroke="#a04c13" stroke-width="2.7"/>
<circle cx="320.00" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="285.00" y="300.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">R</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Blue: first source line</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Orange: second source line</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">R = (−1,−1,−1)</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The two distinct lines share R.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
