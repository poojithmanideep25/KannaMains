<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q4: use two movements within the actual triangle</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q4: use two movements within the actual triangle</text>
<polygon points="409.30,200.99 99.56,274.49 317.53,120.00" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="409.30" y1="200.99" x2="99.56" y2="274.49" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="409.30" y1="200.99" x2="317.53" y2="120.00" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="99.56" y1="274.49" x2="317.53" y2="120.00" stroke="#718594" stroke-width="2.7"/>
<line x1="409.30" y1="200.99" x2="540.44" y2="430.00" stroke="#a33434" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="409.30" cy="200.99" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="424.30" y="225.99" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">A</text>
<circle cx="99.56" cy="274.49" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="69.56" y="259.49" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">B</text>
<circle cx="317.53" cy="120.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="332.53" y="105.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">C</text>
<circle cx="540.44" cy="430.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="555.44" y="415.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">n</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A = (1,0,0); B = (0,2,0)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">C = (1,1,1)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">AB and AC lie in the plane.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Normal direction: (2,1,−1)</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Its displayed arrow length</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">is chosen for visibility.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>