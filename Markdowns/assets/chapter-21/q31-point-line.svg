<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q31: OP = OH + HP in the actual projection plane</title><desc id="desc">True orthonormal plane section of saved original 3D coordinates,not the original xy-plane.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q31: OP = OH + HP in the actual projection plane</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="480.0" height="288.75805665989844"/></clipPath></defs>
<line x1="191.67" y1="388.76" x2="191.67" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="282.09" x2="565.00" y2="282.09" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="577.00" y="288.09" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">u</text>
<text x="201.67" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">v</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">O = (0,0,0); P = (1,1,1)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">H = (5,10,10)/9</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Blue OH is the along-line part.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Orange HP is the perpendicular part.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Gray OP is the whole arrow.</text>
