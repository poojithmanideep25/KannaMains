<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q35: AC is exactly twice AB along one line</title><desc id="desc">True orthonormal plane section of saved original 3D coordinates,not the original xy-plane.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q35: AC is exactly twice AB along one line</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="480.0" height="160.0"/></clipPath></defs>
<line x1="165.00" y1="260.00" x2="165.00" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="180.00" x2="565.00" y2="180.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="577.00" y="186.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">u</text>
<text x="175.00" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">v</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A = (1,2,3); B = (3,5,7)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">C = (5,8,11)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">AB = (2,3,4)</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">AC = (4,6,8) = 2AB</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">This is a true view along the line.</text>
<line x1="165.00" y1="180.00" x2="485.00" y2="180.00" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="165.00" cy="180.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="140.00" y="205.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">A</text>
<circle cx="325.00" cy="180.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="315.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">B</text>
<circle cx="485.00" cy="180.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="500.00" y="205.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">C</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units in a true plane inside 3D; u,v are not the original x,y axes.</text>
</svg>