<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q19: this line lies in the plane, it does not stand out of it</text>
<polygon points="290.61,120.00 496.44,267.05 349.39,430.00 143.56,282.95" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="348.77" y1="368.95" x2="291.23" y2="181.05" stroke="#155e82" stroke-width="2.7"/>
<line x1="320.00" y1="275.00" x2="292.60" y2="353.31" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
