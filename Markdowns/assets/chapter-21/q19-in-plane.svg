<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q19: this line lies in the plane, it does not stand out of it</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
