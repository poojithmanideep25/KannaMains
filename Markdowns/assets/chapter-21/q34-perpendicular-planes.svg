<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q34: old normals lie along the required new plane</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q34: old normals lie along the required new plane</text>
<polygon points="159.19,430.00 197.82,171.16 480.81,120.00 442.18,378.84" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="320.00" y1="275.00" x2="262.24" y2="201.42" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="320.00" y1="275.00" x2="384.54" y2="168.28" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="320.00" y1="275.00" x2="398.55" y2="375.06" stroke="#a33434" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="262.24" cy="201.42" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="274.24" y="186.42" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">u</text>
<circle cx="384.54" cy="168.28" r="4.8" fill="#a04c13" stroke="#a04c13" stroke-width="2"/>
<text x="354.54" y="193.28" font-family="Arial,sans-serif" font-size="19" fill="#a04c13" text-anchor="start" font-weight="400">v</text>
<circle cx="398.55" cy="375.06" r="4.8" fill="#a33434" stroke="#a33434" stroke-width="2"/>
<text x="413.55" y="360.06" font-family="Arial,sans-serif" font-size="19" fill="#a33434" text-anchor="start" font-weight="400">n</text>
<circle cx="320.00" cy="275.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="290.00" y="300.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">P</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P = (1,2,3)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">u,v are the two given normals,</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">moved to a common start P.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">n = (3,−1,−2) is perpendicular</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">to both; display lengths chosen.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>