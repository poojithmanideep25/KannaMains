<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q14: three intercepts determine the plane</title><desc id="desc">Orthographic projection of explicit original 3D coordinates; apparent lengths/angles may be shortened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q14: three intercepts determine the plane</text>
<polygon points="348.15,357.30 212.41,389.51 292.85,156.48" fill="#edf3f7" stroke="#718594" stroke-width="1.3" fill-opacity="0.65"/>
<line x1="292.85" y1="338.89" x2="491.95" y2="405.15" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="292.85" y1="338.89" x2="148.05" y2="430.00" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="292.85" y1="338.89" x2="292.85" y2="120.00" stroke="#718594" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="348.15" y1="357.30" x2="212.41" y2="389.51" stroke="#155e82" stroke-width="2.7"/>
<line x1="212.41" y1="389.51" x2="292.85" y2="156.48" stroke="#155e82" stroke-width="2.7"/>
<line x1="292.85" y1="156.48" x2="348.15" y2="357.30" stroke="#155e82" stroke-width="2.7"/>
<circle cx="491.95" cy="405.15" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="503.95" y="410.15" font-family="Arial,sans-serif" font-size="19" fill="#718594" text-anchor="start" font-weight="400">x</text>
<circle cx="148.05" cy="430.00" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="160.05" y="435.00" font-family="Arial,sans-serif" font-size="19" fill="#718594" text-anchor="start" font-weight="400">y</text>
<circle cx="292.85" cy="120.00" r="4.8" fill="#718594" stroke="#718594" stroke-width="2"/>
<text x="304.85" y="125.00" font-family="Arial,sans-serif" font-size="19" fill="#718594" text-anchor="start" font-weight="400">z</text>
<circle cx="348.15" cy="357.30" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="363.15" y="382.30" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">A</text>
<circle cx="212.41" cy="389.51" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="182.41" y="374.51" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">B</text>
<circle cx="292.85" cy="156.48" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="307.85" y="141.48" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">C</text>
<circle cx="292.85" cy="338.89" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="307.85" y="323.89" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">O</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A = (1,0,0); B = (0,2,0)</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">C = (0,0,3)</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The plane is 6x+3y+2z = 6.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">O is not on this plane.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A true distance section follows.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Actual 3D coordinates; this spatial view can shorten apparent lengths and angles.</text>
</svg>