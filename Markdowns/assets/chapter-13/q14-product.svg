<text x="675.00" y="115.00" font-family="Arial,sans-serif" font-size="20" fill="#155e82" text-anchor="start" font-weight="400">height = ln(1+t)</text>
<text x="675.00" y="205.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">First remove the n factors.</text>
