<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Idempotent: the output stays fixed on the second action</title><desc id="desc">Projectiondiag(1,0)maps(2,2)to(2,0),thenleaves(2,0)unchanged.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Idempotent: the output stays fixed on the second action</text>
<defs><clipPath id="plot1"><rect x="130" y="135" width="350" height="350"/></clipPath></defs>
<line x1="180.00" y1="485.00" x2="180.00" y2="135.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130.00" y1="435.00" x2="480.00" y2="435.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280.00" y1="431.00" x2="280.00" y2="439.00" stroke="#718594" stroke-width="1"/>
<text x="280.00" y="458.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">1</text>
<line x1="380.00" y1="431.00" x2="380.00" y2="439.00" stroke="#718594" stroke-width="1"/>
<text x="380.00" y="458.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<line x1="176.00" y1="335.00" x2="184.00" y2="335.00" stroke="#718594" stroke-width="1"/>
<text x="170.00" y="340.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">1</text>
<line x1="176.00" y1="235.00" x2="184.00" y2="235.00" stroke="#718594" stroke-width="1"/>
<text x="170.00" y="240.00" font-family="Arial,sans-serif" font-size="16" fill="#20394d" text-anchor="end" font-weight="400">2</text>
<text x="492.00" y="441.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x</text>
<text x="190.00" y="143.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y</text>
<circle cx="380.00" cy="235.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="392.00" y="220.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">input (2,2)</text>
<circle cx="380.00" cy="435.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="392.00" y="420.00" font-family="Arial,sans-serif" font-size="19" fill="#155e82" text-anchor="start" font-weight="400">output (2,0)</text>
<line x1="380.00" y1="235.00" x2="380.00" y2="435.00" stroke="#155e82" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="620.00" y="185.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="start" font-weight="400">A = diag(1,0)</text>
<text x="620.00" y="285.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="start" font-weight="400">First: (2,2) → (2,0)</text>
<text x="620.00" y="385.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="start" font-weight="400">Again: (2,0) → (2,0)</text>
<text x="500.00" y="602.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The arrow joins before and after points; it is not a force. The whole action satisfies A²=A.</text>
</svg>