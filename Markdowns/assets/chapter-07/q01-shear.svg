<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">A shear adds the same horizontal amount each time</title><desc id="desc">A=[[1,2],[0,1]]mapssecondbasisvector(0,1)to(2,1),(4,1),(6,1).</desc>
