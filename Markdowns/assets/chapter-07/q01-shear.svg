<text x="500.00" y="90.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Height stays 1; each application adds 2 to the horizontal coordinate.</text>
<text x="500.00" y="532.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Arrows link successive images. Equal unit scales; explanatory first three steps of Q1.</text>
