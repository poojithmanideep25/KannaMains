<text x="220.00" y="295.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="400">(2,4,0)</text>
<circle cx="450.00" cy="230.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="450.00" y="200.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">z = 1</text>
<text x="450.00" y="295.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="400">(3,2,1)</text>
<circle cx="680.00" cy="230.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="680.00" y="200.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">z = 2</text>
