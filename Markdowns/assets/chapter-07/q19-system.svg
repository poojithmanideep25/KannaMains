<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">A free parameter labels infinitely many exact solutions</text>
<line x1="150.00" y1="230.00" x2="850.00" y2="230.00" stroke="#155e82" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="850.00" y1="230.00" x2="150.00" y2="230.00" stroke="#155e82" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="220.00" cy="230.00" r="4.8" fill="#155e82" stroke="#155e82" stroke-width="2"/>
