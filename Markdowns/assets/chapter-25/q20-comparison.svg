<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q20: compare angle positions before function values</title><desc id="desc">An original exact data/count table records the objects and quantities used in the solution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q20: compare angle positions before function values</text>
<rect x="65" y="110" width="185" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Claim</text>
<rect x="250" y="110" width="260" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="262.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Reason</text>
<rect x="510" y="110" width="55" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="522.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Truth</text>
<rect x="65" y="158" width="185" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos1° &gt; cos1</text>
<rect x="250" y="158" width="260" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="262.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos decreases on[0,π]</text>
<rect x="510" y="158" width="55" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="522.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">T</text>
<rect x="65" y="206" width="185" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">tan1 &gt; tan1°</text>
<rect x="250" y="206" width="260" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="262.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">tan increases on(−π/2,π/2)</text>
<rect x="510" y="206" width="55" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="522.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">T</text>
<rect x="65" y="254" width="185" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">sin2 &lt; sin1</text>
<rect x="250" y="254" width="260" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="262.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">sin2=sin(π−2)&gt;sin1</text>
<rect x="510" y="254" width="55" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="522.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">F</text>
<rect x="65" y="302" width="185" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos3 &lt; cos2</text>
<rect x="250" y="302" width="260" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="262.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">2&lt;3&lt;π;cos decreases</text>
<rect x="510" y="302" width="55" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="522.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">T</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">1° is onlyπ/180 radians.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">An unmarked1 means1radian.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Sine turns downward afterπ/2.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Use its reflection,not a false</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">whole-interval increasing rule.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Read each row with its header; the listed values are the quantities used in the solution.</text>
</svg>