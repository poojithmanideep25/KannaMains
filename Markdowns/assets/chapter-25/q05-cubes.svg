<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q5: the sum creates the product,and the product creates the cubes</title><desc id="desc">An original exact data/count table records the objects and quantities used in the solution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q5: the sum creates the product,and the product creates the cubes</text>
<rect x="65" y="110" width="330" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Known or derived</text>
<rect x="395" y="110" width="170" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="407.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Value</text>
<rect x="65" y="158" width="330" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">s+c</text>
<rect x="395" y="158" width="170" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="407.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">1/2</text>
<rect x="65" y="206" width="330" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">s²+c²</text>
<rect x="395" y="206" width="170" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="407.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">1</text>
<rect x="65" y="254" width="330" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">2sc = (s+c)² − 1</text>
<rect x="395" y="254" width="170" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="407.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">−3/4</text>
<rect x="65" y="302" width="330" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">s³+c³ = (s+c)(1−sc)</text>
<rect x="395" y="302" width="170" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="407.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">11/16</text>
<rect x="65" y="350" width="330" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="382.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Requested 16(s³+c³)</text>
<rect x="395" y="350" width="170" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="407.00" y="382.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">11</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Here s=sin θ and c=cos θ.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">No individual angle is required.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The given sum already fixes</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">the symmetric target.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Read each row with its header; the listed values are the quantities used in the solution.</text>
</svg>