<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q24: numerator and denominator contain the same sine</title><desc id="desc">An original exact data/count table records the objects and quantities used in the solution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q24: numerator and denominator contain the same sine</text>
<rect x="65" y="110" width="235" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Part</text>
<rect x="300" y="110" width="265" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="312.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">After one useful identity</text>
<rect x="65" y="158" width="235" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Common denominator</text>
<rect x="300" y="158" width="265" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="312.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">sin10°cos10° = sin20°/2</text>
<rect x="65" y="206" width="235" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">New numerator</text>
<rect x="300" y="206" width="265" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="312.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos10° − √3sin10°</text>
<rect x="65" y="254" width="235" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Recognize a cosine sum</text>
<rect x="300" y="254" width="265" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="312.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">2cos70° = 2sin20°</text>
<rect x="65" y="302" width="235" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Take the ratio</text>
<rect x="300" y="302" width="265" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="312.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(2sin20°)/(sin20°/2) = 4</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Neither original denominator is0.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Pair the two fractions first.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The cancellation is now visible.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Do not approximate10°decimally.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Read each row with its header; the listed values are the quantities used in the solution.</text>
</svg>