<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q1: choose angles whose sum and difference are useful</title><desc id="desc">An original exact data/count table records the objects and quantities used in the solution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q1: choose angles whose sum and difference are useful</text>
<rect x="65" y="110" width="230" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Piece</text>
<rect x="295" y="110" width="270" height="48" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="307.00" y="142.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="700">Exact connection</text>
<rect x="65" y="158" width="230" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">sin 54°</text>
<rect x="295" y="158" width="270" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="307.00" y="190.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos 36°</text>
<rect x="65" y="206" width="230" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">2 sin 12° sin 48°</text>
<rect x="295" y="206" width="270" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="307.00" y="238.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos 36° − cos 60°</text>
<rect x="65" y="254" width="230" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos 36°</text>
<rect x="295" y="254" width="270" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="307.00" y="286.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(√5+1)/4</text>
<rect x="65" y="302" width="230" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="77.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">cos 36° − 1/2</text>
<rect x="295" y="302" width="270" height="48" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="307.00" y="334.16" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">(√5−1)/4</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Pair 12° and 48° first.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Their difference is 36°.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The remaining factor is cos 36°.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The final product is 1/8.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Read each row with its header; the listed values are the quantities used in the solution.</text>
