<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">A determinant keeps the area and an orientation sign</title><desc id="desc">Columns u=(3,1), v=(1,2) have determinant5; swapping columns gives-5. Parallel columns u,2u give0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">A determinant keeps the area and an orientation sign</text>
<polygon points="70.00,340.00 226.00,288.00 278.00,184.00 122.00,236.00" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<line x1="70.00" y1="340.00" x2="226.00" y2="288.00" stroke="#155e82" stroke-width="2.7" marker-end="url(#arrow)"/>
<line x1="70.00" y1="340.00" x2="122.00" y2="236.00" stroke="#a04c13" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="180.00" y="100.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">First u, then v</text>
<text x="236.00" y="310.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="start" font-weight="400">u</text>
<text x="117.00" y="219.00" font-family="Arial,sans-serif" font-size="22" fill="#a04c13" text-anchor="start" font-weight="400">v</text>
<text x="180.00" y="400.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Ordinary area = 5</text>
<text x="180.00" y="440.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="700">D = 5</text>
<polygon points="400.00,340.00 452.00,236.00 608.00,184.00 556.00,288.00" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<line x1="400.00" y1="340.00" x2="452.00" y2="236.00" stroke="#155e82" stroke-width="2.7" marker-end="url(#arrow)"/>
<line x1="400.00" y1="340.00" x2="556.00" y2="288.00" stroke="#a04c13" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="510.00" y="100.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">First v, then u</text>
<text x="462.00" y="258.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="start" font-weight="400">v</text>
<text x="551.00" y="271.00" font-family="Arial,sans-serif" font-size="22" fill="#a04c13" text-anchor="start" font-weight="400">u</text>
<text x="510.00" y="400.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Ordinary area = 5</text>
<text x="510.00" y="440.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="700">D = −5</text>
<polygon points="730.00,340.00 808.00,314.00 964.00,262.00 886.00,288.00" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<line x1="730.00" y1="340.00" x2="808.00" y2="314.00" stroke="#155e82" stroke-width="2.7" marker-end="url(#arrow)"/>
<line x1="730.00" y1="340.00" x2="886.00" y2="288.00" stroke="#a04c13" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="840.00" y="100.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">Parallel arrows</text>
<text x="798.00" y="294.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="start" font-weight="400">u</text>
<text x="895.00" y="278.00" font-family="Arial,sans-serif" font-size="22" fill="#a04c13" text-anchor="start" font-weight="400">2u</text>
<text x="840.00" y="400.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Ordinary area = 0</text>
<text x="840.00" y="440.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="700">D = 0</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Real vectors; equal unit scales within each panel. The first two regions are the same.</text>
</svg>