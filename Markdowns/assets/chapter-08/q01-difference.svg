<text x="500.00" y="395.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">7−8+1 = 0;   8−10+2 = 0;   10−12+3 = 1</text>
<text x="500.00" y="462.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Only row 3 changes. Its own coefficient stays one, so the determinant is unchanged.</text>
