<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">Ordered differences explain the Vandermonde sign</title><desc id="desc">Q2columnorderalpha1,beta2,gamma-3. Directed differences beta-alpha1,gamma-alpha-4,gamma-beta-5.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Ordered differences explain the Vandermonde sign</text>
<line x1="100.00" y1="140.00" x2="850.00" y2="140.00" stroke="#718594" stroke-width="1.2"/>
<circle cx="140.00" cy="140.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="140.00" y="171.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">γ = −3</text>
<circle cx="660.00" cy="140.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="660.00" y="171.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">α = 1</text>
<circle cx="790.00" cy="140.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="790.00" y="171.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">β = 2</text>
<line x1="660.00" y1="122.00" x2="790.00" y2="122.00" stroke="#a04c13" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="900.00" y="126.00" font-family="Arial,sans-serif" font-size="21" fill="#a04c13" text-anchor="end" font-weight="700">β−α = 1</text>
<line x1="100.00" y1="260.00" x2="850.00" y2="260.00" stroke="#718594" stroke-width="1.2"/>
<circle cx="140.00" cy="260.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="140.00" y="291.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">γ = −3</text>
<circle cx="660.00" cy="260.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="660.00" y="291.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">α = 1</text>
<circle cx="790.00" cy="260.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="790.00" y="291.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">β = 2</text>
<line x1="660.00" y1="242.00" x2="140.00" y2="242.00" stroke="#a04c13" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="900.00" y="246.00" font-family="Arial,sans-serif" font-size="21" fill="#a04c13" text-anchor="end" font-weight="700">γ−α = −4</text>
<line x1="100.00" y1="380.00" x2="850.00" y2="380.00" stroke="#718594" stroke-width="1.2"/>
<circle cx="140.00" cy="380.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="140.00" y="411.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">γ = −3</text>
<circle cx="660.00" cy="380.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="660.00" y="411.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">α = 1</text>
<circle cx="790.00" cy="380.00" r="4" fill="#155e82" stroke="#155e82" stroke-width="2"/>
<text x="790.00" y="411.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">β = 2</text>
<line x1="790.00" y1="362.00" x2="140.00" y2="362.00" stroke="#a04c13" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="900.00" y="366.00" font-family="Arial,sans-serif" font-size="21" fill="#a04c13" text-anchor="end" font-weight="700">γ−β = −5</text>
<text x="500.00" y="492.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Each arrow is end minus start. Positive × negative × negative = positive.</text>
</svg>