<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Row scaling and reversal explain the factor minus six</title><desc id="desc">Q16newrowsR1+2R2,3R1; subtractnewrow2/3fromtopgives2R2,3R1,det=-6original.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Row scaling and reversal explain the factor minus six</text>
<text x="205.00" y="213.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">R1 + 2R2</text>
<text x="205.00" y="283.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">3R1</text>
<line x1="81.00" y1="165.00" x2="81.00" y2="315.00" stroke="#20394d" stroke-width="2"/>
<line x1="329.00" y1="165.00" x2="329.00" y2="315.00" stroke="#20394d" stroke-width="2"/>
<line x1="355.00" y1="240.00" x2="615.00" y2="240.00" stroke="#718594" stroke-width="2" marker-end="url(#arrow)"/>
<text x="485.00" y="185.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle" font-weight="400">top − bottom/3</text>
<text x="785.00" y="213.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">2R2</text>
<text x="785.00" y="283.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">3R1</text>
<line x1="671.00" y1="165.00" x2="671.00" y2="315.00" stroke="#20394d" stroke-width="2"/>
<line x1="899.00" y1="165.00" x2="899.00" y2="315.00" stroke="#20394d" stroke-width="2"/>
<text x="500.00" y="380.00" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle" font-weight="400">Pull out 2 and 3: factor 6</text>
<text x="500.00" y="430.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="400">Remaining row order R2, R1: one swap gives −1</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">R1 and R2 here name original rows, not individual entries.</text>
