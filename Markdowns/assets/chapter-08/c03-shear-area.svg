<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Adding a multiple of one side to the other keeps area</title><desc id="desc">Shear v→v+u/2 for u=(2,0), v=(0,2), produces same base2 and height2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Adding a multiple of one side to the other keeps area</text>
<polygon points="110.00,340.00 260.00,340.00 260.00,190.00 110.00,190.00" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<line x1="110.00" y1="340.00" x2="260.00" y2="340.00" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="110.00" y1="340.00" x2="110.00" y2="190.00" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<text x="210.00" y="105.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Before</text>
<text x="185.00" y="375.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">base = 2</text>
<line x1="370.00" y1="340.00" x2="370.00" y2="190.00" stroke="#718594" stroke-width="1.8"/>
<text x="385.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">height 2</text>
<line x1="110.00" y1="190.00" x2="370.00" y2="190.00" stroke="#718594" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="210.00" y="420.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Area = 4; determinant = 4</text>
<polygon points="610.00,340.00 760.00,340.00 835.00,190.00 685.00,190.00" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<line x1="610.00" y1="340.00" x2="760.00" y2="340.00" stroke="#155e82" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="610.00" y1="340.00" x2="685.00" y2="190.00" stroke="#a04c13" stroke-width="3" marker-end="url(#arrow)"/>
<text x="710.00" y="105.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">After: v + u/2</text>
<text x="685.00" y="375.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">base = 2</text>
<line x1="870.00" y1="340.00" x2="870.00" y2="190.00" stroke="#718594" stroke-width="1.8"/>
<text x="885.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="start" font-weight="400">height 2</text>
<line x1="685.00" y1="190.00" x2="870.00" y2="190.00" stroke="#718594" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="710.00" y="420.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">Area = 4; determinant = 4</text>
<text x="500.00" y="462.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The top slides sideways. The perpendicular height stays fixed; equal geometric scales.</text>
</svg>