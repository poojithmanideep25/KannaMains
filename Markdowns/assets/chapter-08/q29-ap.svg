<text x="405.00" y="174.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">second entry</text>
<rect x="485" y="130" width="160" height="75" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="565.00" y="174.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">third entry</text>
<rect x="645" y="130" width="310" height="75" rx="0" fill="#edf3f7" stroke="#a9bac8" stroke-width="1.5"/>
<text x="800.00" y="174.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">third − 2 second + first</text>
<rect x="45" y="205" width="120" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="105.00" y="249.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">1</text>
<rect x="165" y="205" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="245.00" y="249.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+1</text>
<rect x="325" y="205" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="405.00" y="249.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+2</text>
<rect x="485" y="205" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="565.00" y="249.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+3</text>
<rect x="645" y="205" width="310" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="800.00" y="249.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<rect x="45" y="280" width="120" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="105.00" y="324.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">2</text>
<rect x="165" y="280" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="245.00" y="324.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+2</text>
<rect x="325" y="280" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="405.00" y="324.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+3</text>
<rect x="485" y="280" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="565.00" y="324.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+4</text>
<rect x="645" y="280" width="310" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="800.00" y="324.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">0</text>
<rect x="45" y="355" width="120" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="105.00" y="399.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">3</text>
<rect x="165" y="355" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="245.00" y="399.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+a</text>
<rect x="325" y="355" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="405.00" y="399.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+b</text>
<rect x="485" y="355" width="160" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="565.00" y="399.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">x+c</text>
<rect x="645" y="355" width="310" height="75" rx="0" fill="white" stroke="#a9bac8" stroke-width="1.5"/>
<text x="800.00" y="399.50" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">a−2b+c = 0</text>
<text x="500.00" y="485.00" font-family="Arial,sans-serif" font-size="22" fill="#155e82" text-anchor="middle" font-weight="400">One row operation now creates a whole zero row: determinant = 0.</text>
<text x="500.00" y="542.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The final zero uses the given AP condition; the first two zeros hold for every x.</text>
</svg>