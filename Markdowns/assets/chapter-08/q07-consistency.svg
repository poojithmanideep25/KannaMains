<text x="500.00" y="535.00" font-family="Arial,sans-serif" font-size="21" fill="#a33434" text-anchor="middle" font-weight="400">If λ = 5 but μ ≠ 13, subtracting gives 0 = μ−13: impossible.</text>
<text x="500.00" y="572.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The first two rows are independent; when the third repeats them, one variable is free.</text>
