<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">AND, OR and NOT refer to different parts of the same space</title><desc id="desc">Explanatory set geometry with overlapping event circles; geometric area is not probability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">AND, OR and NOT refer to different parts of the same space</text>
<rect x="85" y="105" width="480" height="365" rx="0" fill="white" stroke="#20394d" stroke-width="1.5"/>
<circle cx="250.00" cy="275.00" r="105" fill="#edf3f7" stroke="#155e82" stroke-width="2"/>
<circle cx="390.00" cy="275.00" r="105" fill="none" stroke="#a04c13" stroke-width="2"/>
<text x="175.00" y="150.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">A</text>
<text x="460.00" y="150.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">B</text>
<text x="205.00" y="280.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">A only</text>
<text x="320.00" y="280.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">Both</text>
<text x="440.00" y="280.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">B only</text>
<text x="150.00" y="435.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle" font-weight="400">Neither</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The rectangle is the whole space.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A and B: the overlap.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A or B: both circles together.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Neither: outside both circles.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Not both: remove only the overlap.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">This is a set-membership picture; circle areas do not represent probabilities.</text>
</svg>