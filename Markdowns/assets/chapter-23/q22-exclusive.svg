<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Q22: disjoint events have no common part</title><desc id="desc">A probability-length strip partitions the complete sample space into disjoint event classes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q22: disjoint events have no common part</text>
<rect x="85" y="180" width="144.0" height="110" rx="0" fill="#edf3f7" stroke="#20394d" stroke-width="1.5"/>
<text x="157.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">1</text>
<rect x="229.0" y="180" width="0.0" height="110" rx="0" fill="#edf3f7" stroke="#20394d" stroke-width="1.5"/>
<rect x="229.0" y="180" width="192.0" height="110" rx="0" fill="#edf3f7" stroke="#20394d" stroke-width="1.5"/>
<text x="325.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">3</text>
<rect x="421.0" y="180" width="144.0" height="110" rx="0" fill="#edf3f7" stroke="#20394d" stroke-width="1.5"/>
<text x="493.00" y="245.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">4</text>
<text x="85.00" y="345.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Whole strip = probability 1</text>
<text x="85.00" y="385.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">Shaded numbered pieces: asked event</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">1. A only: 3/10</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">2. Both: 0</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">3. B only: 2/5</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">4. Neither: 3/10</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Illustration: P(A)=0.3, P(B)=0.4.</text>
<text x="635.00" y="330.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Overlap = 0, product = 0.12.</text>
<text x="635.00" y="370.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">So positive disjoint events</text>
<text x="635.00" y="410.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">cannot be independent.</text>
<text x="500.00" y="547.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Strip lengths are proportional to the stated probabilities; regions do not overlap.</text>
</svg>