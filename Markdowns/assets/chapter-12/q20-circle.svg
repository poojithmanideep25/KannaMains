<text x="585.00" y="110.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Picture uses 0 &lt; x &lt; 1.</text>
<text x="585.00" y="156.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">x = sin θ; y = cos θ</text>
<text x="585.00" y="202.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">y = √(1−x²)</text>
<text x="585.00" y="248.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Sector area = θ/2</text>
<text x="585.00" y="294.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Triangle area = xy/2</text>
<text x="585.00" y="340.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Their sum is the primitive</text>
<text x="585.00" y="386.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">with value zero at x = 0.</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Equal units. The algebraic primitive holds on −1 &lt; x &lt; 1; the area partition here uses x &gt; 0.</text>
