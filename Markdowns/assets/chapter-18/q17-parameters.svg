<title id="title">Q17: focal-chord parameters have opposite signs</title><desc id="desc">NormalizedcoordinatesX=x/a,Y=y/ashowtheactualparameterconstructionindependentof a;points9,6and1/9,−2/3.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Q17: focal-chord parameters have opposite signs</text>
<defs><clipPath id="plot1"><rect x="85" y="100" width="381.8181818181818" height="350.0"/></clipPath></defs>
<line x1="116.82" y1="450.00" x2="116.82" y2="100.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="85.00" y1="354.55" x2="466.82" y2="354.55" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="478.82" y="360.55" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">x/a</text>
<text x="126.82" y="108.00" font-family="Arial,sans-serif" font-size="18" fill="#20394d" text-anchor="start" font-weight="400">y/a</text>
<text x="635.00" y="130.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Axes use X = x/a, Y = y/a.</text>
<text x="635.00" y="170.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">So the equation is Y² = 4X.</text>
<text x="635.00" y="210.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">P has parameter t = 3.</text>
<text x="635.00" y="250.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">F lies between the endpoints.</text>
<text x="635.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">The other parameter is −1/3.</text>
