<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Digit sets with zero lose two leading-zero orders</title><desc id="desc">Sevenunorderedtripleswithsum9aregroupedintofourwithzeroandthreewithout.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Digit sets with zero lose two leading-zero orders</text>
<text x="260.00" y="100.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Zero included: 4 sets</text>
<text x="750.00" y="100.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">No zero: 3 sets</text>
<text x="260.00" y="165.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{0,1,8}</text>
<text x="260.00" y="220.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{0,2,7}</text>
<text x="260.00" y="275.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{0,3,6}</text>
<text x="260.00" y="330.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{0,4,5}</text>
<text x="750.00" y="165.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{1,2,6}</text>
<text x="750.00" y="220.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{1,3,5}</text>
<text x="750.00" y="275.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">{2,3,4}</text>
<text x="260.00" y="415.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="400">Each: 3!−2! = 4 orders</text>
<text x="750.00" y="415.00" font-family="Arial,sans-serif" font-size="23" fill="#155e82" text-anchor="middle" font-weight="400">Each: 3! = 6 orders</text>
<text x="500.00" y="482.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Total valid three-digit numbers: 4×4 + 3×6 = 34.</text>
</svg>