<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Equal copies do not create a new visible word</title><desc id="desc">All6labelled permutations ofA1,A2,B map in equal pairs to3visible words.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Equal copies do not create a new visible word</text>
<text x="310.00" y="105.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">Temporary labels on equal A copies</text>
<text x="790.00" y="105.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="700">Visible word</text>
<text x="310.00" y="185.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">A₁ A₂ B   or   A₂ A₁ B</text>
<line x1="565.00" y1="178.00" x2="665.00" y2="178.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="790.00" y="185.00" font-family="Arial,sans-serif" font-size="27" fill="#155e82" text-anchor="middle" font-weight="400">AAB</text>
<text x="310.00" y="270.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">A₁ B A₂   or   A₂ B A₁</text>
<line x1="565.00" y1="263.00" x2="665.00" y2="263.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="790.00" y="270.00" font-family="Arial,sans-serif" font-size="27" fill="#155e82" text-anchor="middle" font-weight="400">ABA</text>
<text x="310.00" y="355.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">B A₁ A₂   or   B A₂ A₁</text>
<line x1="565.00" y1="348.00" x2="665.00" y2="348.00" stroke="#718594" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="790.00" y="355.00" font-family="Arial,sans-serif" font-size="27" fill="#155e82" text-anchor="middle" font-weight="400">BAA</text>
<text x="500.00" y="432.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Each visible word has exactly 2! labelled versions. Count = 3!/2! = 3.</text>
</svg>