<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">At least two women: three disjoint committee types</title><desc id="desc">Four-member committees from4women6men havecases2W2M,3W1M,4W0M.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">At least two women: three disjoint committee types</text>
<text x="70.00" y="135.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="start" font-weight="400">2 women + 2 men</text>
<text x="520.00" y="135.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">C(4,2) × C(6,2)</text>
<text x="875.00" y="135.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">90</text>
<text x="70.00" y="225.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="start" font-weight="400">3 women + 1 man</text>
<text x="520.00" y="225.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">C(4,3) × C(6,1)</text>
<text x="875.00" y="225.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">24</text>
<text x="70.00" y="315.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="start" font-weight="400">4 women + 0 men</text>
<text x="520.00" y="315.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">C(4,4) × C(6,0)</text>
<text x="875.00" y="315.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="700">1</text>
<text x="500.00" y="405.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">Add the cases: 90 + 24 + 1 = 115</text>
<text x="500.00" y="462.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">C(n,r) means choose r from n. Membership order does not create a new committee.</text>
</svg>