<text x="500.00" y="432.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">Extra counts may be zero. Labelled boxes mean (6,0,0,0) and (0,6,0,0) differ.</text>
