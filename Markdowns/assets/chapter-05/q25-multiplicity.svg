<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Partial words: count which repeated pairs are used</title><desc id="desc">ARRANGEcountsA2R2N1G1E1 yieldbothpairs90,exactlyone480,nopair120.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Partial words: count which repeated pairs are used</text>
<text x="55.00" y="125.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">Both pairs</text>
<text x="55.00" y="165.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A A R R + one of N,G,E</text>
<text x="680.00" y="141.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">3 × 5!/(2!2!)</text>
<text x="930.00" y="141.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="end" font-weight="700">90</text>
<text x="55.00" y="250.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">Exactly one pair</text>
<text x="55.00" y="290.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">Pair type: A or R; 3 other types</text>
<text x="680.00" y="266.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">2 × C(4,3) × 5!/2!</text>
<text x="930.00" y="266.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="end" font-weight="700">480</text>
<text x="55.00" y="375.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="start" font-weight="700">No pair</text>
<text x="55.00" y="415.00" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="start" font-weight="400">A R N G E</text>
<text x="680.00" y="391.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="400">5!</text>
<text x="930.00" y="391.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="end" font-weight="700">120</text>
<text x="500.00" y="522.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The cases are disjoint and cover every five-letter word. Total: 90 + 480 + 120 = 690.</text>
</svg>