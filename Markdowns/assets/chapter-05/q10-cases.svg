<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Two restricted positions can compete for a digit</title><desc id="desc">First3or5permits3evenendings; first4permitsonly0or2;middlepositions4then3choices.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Two restricted positions can compete for a digit</text>
<text x="170.00" y="110.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">First digit</text>
<text x="420.00" y="110.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">Last digit</text>
<text x="665.00" y="110.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">Middle 2 places</text>
<text x="875.00" y="110.00" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle" font-weight="700">Count</text>
<text x="170.00" y="210.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">3 or 5</text>
<text x="420.00" y="210.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">0, 2, 4</text>
<text x="665.00" y="210.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">4 × 3</text>
<text x="875.00" y="210.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="400">72</text>
<text x="170.00" y="310.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">4</text>
<text x="420.00" y="310.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">0, 2</text>
<text x="665.00" y="310.00" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle" font-weight="400">4 × 3</text>
<text x="875.00" y="310.00" font-family="Arial,sans-serif" font-size="25" fill="#155e82" text-anchor="middle" font-weight="400">24</text>
<text x="500.00" y="442.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The pair (first 4, last 4) is forbidden. Valid first–last pairs: 3×3−1 = 8.</text>
</svg>