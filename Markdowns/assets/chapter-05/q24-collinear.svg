<text x="500.00" y="632.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">All 12 points are shown. Exactly C(5,3)=10 triples are collinear; the other 210 form triangles.</text>
