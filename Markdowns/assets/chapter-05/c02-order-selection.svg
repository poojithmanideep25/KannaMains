<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Order matters for roles; it does not for a group</title><desc id="desc">Six ordered pairs fromA,B,Ccollapse into3unordered two-member groups.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Order matters for roles; it does not for a group</text>
<text x="260.00" y="105.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Ordered pairs</text>
<text x="745.00" y="105.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Same selected group</text>
<text x="260.00" y="175.00" font-family="Arial,sans-serif" font-size="26" fill="#155e82" text-anchor="middle" font-weight="400">AB or BA</text>
<line x1="420.00" y1="168.00" x2="570.00" y2="168.00" stroke="#718594" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="745.00" y="175.00" font-family="Arial,sans-serif" font-size="26" fill="#20394d" text-anchor="middle" font-weight="400">{A, B}</text>
<text x="260.00" y="260.00" font-family="Arial,sans-serif" font-size="26" fill="#155e82" text-anchor="middle" font-weight="400">AC or CA</text>
<line x1="420.00" y1="253.00" x2="570.00" y2="253.00" stroke="#718594" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="745.00" y="260.00" font-family="Arial,sans-serif" font-size="26" fill="#20394d" text-anchor="middle" font-weight="400">{A, C}</text>
<text x="260.00" y="345.00" font-family="Arial,sans-serif" font-size="26" fill="#155e82" text-anchor="middle" font-weight="400">BC or CB</text>
<line x1="420.00" y1="338.00" x2="570.00" y2="338.00" stroke="#718594" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="745.00" y="345.00" font-family="Arial,sans-serif" font-size="26" fill="#20394d" text-anchor="middle" font-weight="400">{B, C}</text>
<text x="500.00" y="432.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">6 ordered outcomes / 2! orders per group = 3 selected groups.</text>
</svg>