<circle cx="260.00" cy="410.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="260.00" y="418.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">C</text>
<circle cx="130.00" cy="280.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="130.00" y="288.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">D</text>
<text x="260.00" y="470.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Clockwise: ABCD</text>
<circle cx="740.00" cy="280.00" r="130" fill="none" stroke="#718594" stroke-width="1.8"/>
<circle cx="740.00" cy="150.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="740.00" y="158.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">A</text>
<circle cx="870.00" cy="280.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="870.00" y="288.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">D</text>
<circle cx="740.00" cy="410.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="740.00" y="418.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">C</text>
<circle cx="610.00" cy="280.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="610.00" y="288.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">B</text>
<text x="740.00" y="470.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="400">Clockwise: ADCB</text>
<text x="500.00" y="95.00" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle" font-weight="400">Fix A at the top in both views</text>
<text x="500.00" y="535.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">Different table orders; the same freely turnable necklace.</text>
<text x="500.00" y="582.00" font-family="Arial,sans-serif" font-size="17" fill="#718594" text-anchor="middle" font-weight="400">The beads are all distinct and n≥3. Reflection equivalence comes from the object, not its circular shape.</text>
