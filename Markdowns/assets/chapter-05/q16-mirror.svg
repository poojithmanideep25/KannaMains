<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Turning over a necklace reverses its clockwise order</title><desc id="desc">FourdistinctbeadsA,B,C,DversusA,D,C,BafterfixingAasreference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20394d"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500.00" y="34.00" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle" font-weight="700">Turning over a necklace reverses its clockwise order</text>
<circle cx="260.00" cy="280.00" r="130" fill="none" stroke="#718594" stroke-width="1.8"/>
<circle cx="260.00" cy="150.00" r="25" fill="white" stroke="#155e82" stroke-width="2"/>
<text x="260.00" y="158.00" font-family="Arial,sans-serif" font-size="24" fill="#155e82" text-anchor="middle" font-weight="400">A</text>
